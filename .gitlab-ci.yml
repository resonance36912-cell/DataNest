stages:
  - audit
  - test
  - build
  - certify
  - deploy
  - promote

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "0"
  CI: "true"
  npm_config_audit: "false"
  npm_config_fund: "false"
  DATANEST_STATIC_EXPORT: "true"
  NEXT_PUBLIC_BASE_PATH: "/DataNest"
  SUPABASE_URL: "$NEXT_PUBLIC_SUPABASE_URL"
  SUPABASE_PUBLISHABLE_KEY: "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

.audit_rules: &audit_rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.cert_rules: &cert_rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.node_job: &node_job
  image: node:24-bookworm-slim
  before_script:
    - node --version
    - npm --version

.bun_job: &bun_job
  image: oven/bun:1.3.14
  before_script:
    - bun --version

canonical:traceability:
  stage: audit
  image: mcr.microsoft.com/powershell:7.5-alpine-3.20
  <<: *audit_rules
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - pwsh -NoLogo -NoProfile -File ops/validation/Test-ResonanceTraceability.ps1 -RepoRoot "$CI_PROJECT_DIR"

canonical:git-hygiene:
  stage: audit
  image: alpine/git:2.47.2
  <<: *audit_rules
  script:
    - |
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
      if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
        git diff --check "$BASE" "$CI_COMMIT_SHA"
      else
        git diff --check HEAD^
      fi
    - test -z "$(find . -mindepth 2 -type d -name .git -print -quit)"

open-nova:sealed-manifest:
  stage: audit
  image: mcr.microsoft.com/powershell:7.5-alpine-3.20
  <<: *audit_rules
  script:
    - pwsh -NoLogo -NoProfile -File platform/open-nova/scripts/verify-build-manifest.ps1 -RootPath "$CI_PROJECT_DIR/platform/open-nova"

ronsas:worker-ops:
  stage: audit
  image: oven/bun:1.3.14
  <<: *audit_rules
  script:
    - cd platform/ronsas
    - bun run scripts/verify-worker-ops-manifests.ts

datanest:test:
  <<: *node_job
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - apps/datanest/**/*
        - apps/ronsas/**/*
        - ops/index/**/*
        - .gitlab-ci.yml
  before_script:
    - test -n "$NEXT_PUBLIC_SUPABASE_URL"
    - test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
    - cd apps/datanest
    - npm ci --no-audit --no-fund
  script:
    - npm run check
    - npm test
    - npm run check:contracts
    - npm audit --omit=dev --audit-level=high

datanest:build:
  <<: *node_job
  stage: build
  needs: ["datanest:test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - apps/datanest/**/*
        - apps/ronsas/**/*
        - ops/index/**/*
        - .gitlab-ci.yml
  before_script:
    - test -n "$NEXT_PUBLIC_SUPABASE_URL"
    - test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
    - cd apps/datanest
    - npm ci --no-audit --no-fund
  script:
    - npm run build
    - node scripts/build-ronsas-pages.mjs
    - test -s out/index.html
  artifacts:
    name: "datanest-$CI_COMMIT_SHORT_SHA"
    paths:
      - apps/datanest/out/
    expire_in: 7 days

hub:test-build:
  <<: *bun_job
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - apps/hub/**/*
        - packages/**/*
        - .gitlab-ci.yml
  before_script:
    - cd apps/hub
    - bun install --frozen-lockfile
  script:
    - bun run verify:pinned-deps
    - bun run verify:back-to-hub
    - bun run verify:no-stale-domains
    - bun run verify:honest-copy
    - bun run verify:security
    - bun run verify:app-registry
    - bun run verify:public-audit
    - bun run verify:sovereign-itn
    - bun run verify:transparency-copy
    - bun run verify:discernment-usage
    - bun test scripts/lib/
    - bun run build
    - test -f .output/nitro.json
  artifacts:
    name: "hub-nitro-$CI_COMMIT_SHORT_SHA"
    paths:
      - apps/hub/.output/
    expire_in: 7 days

.bun_app: &bun_app
  <<: *bun_job
  stage: test

app:epublisher:
  <<: *bun_app
  rules:
    - changes:
        - apps/epublisher/**/*
        - .gitlab-ci.yml
  script:
    - cd apps/epublisher
    - bun install --frozen-lockfile
    - bun run lint
    - bun test
    - bun run build

app:creative-studio:
  <<: *bun_app
  rules:
    - changes:
        - apps/creative-studio/**/*
        - .gitlab-ci.yml
  script:
    - cd apps/creative-studio
    - bun install --frozen-lockfile
    - bun run lint
    - bun test
    - bun run build

app:sync-vision:
  <<: *bun_app
  rules:
    - changes:
        - apps/sync-vision/**/*
        - .gitlab-ci.yml
  script:
    - cd apps/sync-vision
    - bun install --frozen-lockfile
    - bun run lint
    - bun run typecheck
    - bun test
    - bun run build

app:youtube-optimizer:
  <<: *bun_app
  rules:
    - changes:
        - apps/youtube-optimizer/**/*
        - .gitlab-ci.yml
  script:
    - cd apps/youtube-optimizer
    - bun install --frozen-lockfile
    - bun run lint
    - bun run typecheck
    - bun test
    - bun run check:config
    - bun run build

open-nova:test:
  stage: test
  image: python:3.12-slim
  rules:
    - changes:
        - platform/open-nova/**/*
        - .gitlab-ci.yml
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r platform/open-nova/foundry_controller/requirements.txt -r platform/open-nova/services/auth/requirements.txt -r platform/open-nova/services/gateway/requirements.txt -r platform/open-nova/services/storage/requirements.txt
  script:
    - cd platform/open-nova
    - python -m compileall -q foundry_controller services
    - python -m pytest -q

sovereign-backend:test:
  stage: test
  image: python:3.12-slim
  rules:
    - changes:
        - services/sovereign-backend/**/*
        - .gitlab-ci.yml
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r services/sovereign-backend/requirements-dev.txt
  script:
    - cd services/sovereign-backend
    - python -m compileall -q services
    - python -m pytest -q

canonical:certify:
  stage: certify
  image: alpine:3.21
  <<: *cert_rules
  needs:
    - job: canonical:traceability
    - job: canonical:git-hygiene
    - job: open-nova:sealed-manifest
    - job: ronsas:worker-ops
    - job: datanest:test
      optional: true
    - job: datanest:build
      optional: true
    - job: hub:test-build
      optional: true
    - job: app:epublisher
      optional: true
    - job: app:creative-studio
      optional: true
    - job: app:sync-vision
      optional: true
    - job: app:youtube-optimizer
      optional: true
    - job: open-nova:test
      optional: true
    - job: sovereign-backend:test
      optional: true
  script:
    - mkdir -p evidence/ci
    - printf '{"schema":"rsn-ci-certification/v1","commit":"%s","pipeline":"%s","ref":"%s","status":"certified"}\n' "$CI_COMMIT_SHA" "$CI_PIPELINE_ID" "$CI_COMMIT_REF_NAME" > evidence/ci/certification.json
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      - evidence/ci/certification.json

create-pages-candidate:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: datanest:build
      artifacts: true
    - job: canonical:certify
  script:
    - test -s apps/datanest/out/index.html
    - printf 'Candidate publication only; production DNS remains governance-gated.\n'
  pages:
    publish: apps/datanest/out
  environment:
    name: datanest-pages-candidate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  allow_failure: false

governance:approve-production:
  stage: promote
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - if: '$CI_COMMIT_TAG =~ /^rsn-canonical-v/'
      when: manual
    - when: never
  allow_failure: false
  needs: ["canonical:certify"]
  script:
    - echo "Human governance checkpoint approved for $CI_COMMIT_SHA"
    - echo "Deployment remains provider-decoupled and must use the governed release procedure."
