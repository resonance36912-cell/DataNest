name: CI queue janitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: ronsas-ci-queue-janitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prune:
    # GitHub-hosted jobs are currently unavailable for this private repository.
    # Run queue control on the independent Ealiophin Windows control lane; never on the Linux validation runner it manages.
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 5
    steps:
      - name: Prune stale CI queue and dispatch governed recovery
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const targetNames = new Set([
              "Security scan",
              "Verify prebuild",
              "Verify checkout links",
              "Verify ePublisher checkout",
            ]);
            const recoveryNames = new Set([
              "Governed Linux runner recovery",
              "Guarded zombie Linux runner recycle",
              "Temporary format free promotion",
            ]);
            const activeStates = new Set([
              "queued",
              "pending",
              "waiting",
              "in_progress",
              "requested",
            ]);
            const currentRun = Number(context.runId);

            const mainBranch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            const latestMainSha = mainBranch.data.commit.sha;
            core.info(`latest_main_sha=${latestMainSha}`);

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const openByNumber = new Map(
              openPulls.map((pr) => [
                pr.number,
                { number: pr.number, ref: pr.head.ref, sha: pr.head.sha },
              ]),
            );
            const openByHead = new Map(
              openPulls.map((pr) => [
                pr.head.ref,
                { number: pr.number, ref: pr.head.ref, sha: pr.head.sha },
              ]),
            );

            let cancelled = 0;
            for (let pass = 1; pass <= 4; pass += 1) {
              const runsById = new Map();
              let successfulQueries = 0;
              for (const status of activeStates) {
                try {
                  const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    status,
                    per_page: 100,
                  });
                  successfulQueries += 1;
                  for (const run of data.workflow_runs) runsById.set(run.id, run);
                } catch (error) {
                  core.warning(
                    `Unable to query status=${status}: ${error.status || "error"} ${error.message}`,
                  );
                }
              }
              if (successfulQueries === 0) {
                throw new Error("Unable to query any active workflow-run state.");
              }

              let passCancelled = 0;
              for (const run of runsById.values()) {
                if (!activeStates.has(run.status) || run.id === currentRun) continue;

                let reason = null;
                if (targetNames.has(run.name)) {
                  if (run.event === "pull_request") {
                    const linkedPr =
                      Array.isArray(run.pull_requests) && run.pull_requests.length > 0
                        ? run.pull_requests[0]
                        : null;
                    let current =
                      (linkedPr?.number && openByNumber.get(linkedPr.number)) ||
                      openByHead.get(run.head_branch || "");
                    // The open-PR snapshot can become stale while this janitor is
                    // running. Re-check the linked PR before cancelling a run that
                    // otherwise looks unmatched, so a newly-opened PR is preserved.
                    if (!current && linkedPr?.number) {
                      try {
                        const live = await github.rest.pulls.get({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: linkedPr.number,
                        });
                        if (live.data.state === "open") {
                          current = {
                            number: live.data.number,
                            ref: live.data.head.ref,
                            sha: live.data.head.sha,
                          };
                          openByNumber.set(current.number, current);
                          openByHead.set(current.ref, current);
                          core.info(
                            `PR #${current.number} opened after janitor snapshot; preserving linked validation run ${run.id}.`,
                          );
                        }
                      } catch (error) {
                        if (error.status !== 404) {
                          core.warning(
                            `Live PR lookup failed for #${linkedPr.number}: ${error.status || "error"} ${error.message}`,
                          );
                        }
                      }
                    }
                    // GitHub pull_request workflow runs execute synthetic merge refs.
                    // Preserve every run linked to an open PR; each validation
                    // workflow's own concurrency group cancels superseded attempts.
                    if (!current) {
                      reason = "closed or unmatched PR branch";
                    }
                  } else if (run.event === "push" && run.head_branch === "main") {
                    if (run.head_sha !== latestMainSha) {
                      reason = "superseded main push";
                    }
                  } else if (run.event === "push") {
                    const current = openByHead.get(run.head_branch || "");
                    if (!current) {
                      reason = "orphan non-main branch push";
                    } else if (run.head_sha !== current.sha) {
                      reason = `superseded push for PR #${current.number}`;
                    }
                  }
                } else if (run.name === "Temporary format free promotion") {
                  reason = "obsolete temporary formatter";
                } else if (recoveryNames.has(run.name)) {
                  if (run.head_branch !== "main" || run.head_sha !== latestMainSha) {
                    reason = "superseded recovery run";
                  }
                }

                if (!reason) continue;
                core.info(
                  `pass=${pass} cancelling run=${run.id} name=${run.name} reason=${reason}`,
                );
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  cancelled += 1;
                  passCancelled += 1;
                } catch (error) {
                  core.warning(
                    `Run ${run.id} could not be cancelled; it may have completed concurrently: ${error.status || "error"} ${error.message}`,
                  );
                }

                await new Promise((resolve) => setTimeout(resolve, 750));
                try {
                  const latest = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  if (activeStates.has(latest.data.status)) {
                    core.warning(
                      `Run ${run.id} remained ${latest.data.status} after cancellation request; forcing cancellation.`,
                    );
                    await github.request(
                      "POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel",
                      {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        run_id: run.id,
                      },
                    );
                  }
                } catch (error) {
                  core.warning(
                    `Run ${run.id} force-cancel check failed; it may have completed concurrently: ${error.status || "error"} ${error.message}`,
                  );
                }
              }

              core.info(`pass=${pass} cancelled=${passCancelled}`);
              if (pass < 4) {
                await new Promise((resolve) => setTimeout(resolve, 3000));
              }
            }

            core.info(`cancelled_total=${cancelled}`);

            const backlogStates = ["queued", "pending", "waiting"];
            const backlogById = new Map();
            for (const status of backlogStates) {
              try {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  status,
                  per_page: 100,
                });
                for (const run of data.workflow_runs) {
                  if (targetNames.has(run.name)) backlogById.set(run.id, run);
                }
              } catch (error) {
                core.warning(
                  `Unable to query recovery backlog status=${status}: ${error.status || "error"} ${error.message}`,
                );
              }
            }

            const detectActiveTargetWork = async (backlogRuns) => {
              try {
                const { data: activeRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  status: "in_progress",
                  per_page: 100,
                });
                const activeTargets = activeRuns.workflow_runs.filter((run) => targetNames.has(run.name));
                if (activeTargets.length > 0) {
                  core.info(
                    `Target CI is already draining: ${activeTargets.map((run) => `${run.id}:${run.name}`).join(", ")}`,
                  );
                  return true;
                }
              } catch (error) {
                core.warning(
                  `Unable to query in-progress target runs: ${error.status || "error"} ${error.message}`,
                );
              }

              for (const run of backlogRuns.values()) {
                try {
                  const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                    per_page: 100,
                    filter: "latest",
                  });
                  const activeJobs = jobs.jobs.filter((job) => job.status === "in_progress");
                  if (activeJobs.length > 0) {
                    core.info(
                      `Queued workflow ${run.id} has active job(s): ${activeJobs.map((job) => job.name).join(", ")}`,
                    );
                    return true;
                  }
                } catch (error) {
                  core.warning(
                    `Unable to inspect jobs for queued target run ${run.id}: ${error.status || "error"} ${error.message}`,
                  );
                }
              }
              return false;
            };

            let settledBacklogById = backlogById;
            if (settledBacklogById.size === 0) {
              core.info("No queued/pending/waiting target CI remains; recovery dispatch not required.");
            } else {
              let activeTargetWork = await detectActiveTargetWork(settledBacklogById);

              if (!activeTargetWork) {
                core.info(
                  `Idle target backlog observed (${settledBacklogById.size}); waiting 15 seconds to rule out a normal runner handoff.`,
                );
                await new Promise((resolve) => setTimeout(resolve, 15000));

                const refreshedBacklog = new Map();
                let refreshedQueries = 0;
                for (const status of backlogStates) {
                  try {
                    const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      status,
                      per_page: 100,
                    });
                    refreshedQueries += 1;
                    for (const run of data.workflow_runs) {
                      if (targetNames.has(run.name)) refreshedBacklog.set(run.id, run);
                    }
                  } catch (error) {
                    core.warning(
                      `Unable to recheck recovery backlog status=${status}: ${error.status || "error"} ${error.message}`,
                    );
                  }
                }

                if (refreshedQueries === 0) {
                  core.warning(
                    "Backlog recheck failed for every state; preserving runner state instead of dispatching speculative recovery.",
                  );
                  activeTargetWork = true;
                } else {
                  settledBacklogById = refreshedBacklog;
                  if (settledBacklogById.size > 0) {
                    activeTargetWork = await detectActiveTargetWork(settledBacklogById);
                  }
                }
              }

              if (settledBacklogById.size === 0) {
                core.info("Target backlog drained during handoff settle window; recovery dispatch not required.");
              } else if (activeTargetWork) {
                core.info(
                  `Target backlog=${settledBacklogById.size}, but governed CI is actively draining or recovery state is uncertain; recovery dispatch not required.`,
                );
              } else {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: "windows-recover-linux-runner.yml",
                  ref: "main",
                });
                core.info(
                  `dispatched governed Linux runner recovery after idle settle window for backlog=${settledBacklogById.size}`,
                );
              }
            }
