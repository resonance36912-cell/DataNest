name: Restore persistent RONSAS spokes 2026-09-21

on:
  push:
    branches:
      - ronsas/restore-persistent-spokes-20260921
    paths:
      - ".github/workflows/restore-persistent-spokes-20260921.yml"

permissions:
  contents: read

concurrency:
  group: ronsas-persistent-spoke-recovery-20260921
  cancel-in-progress: false

jobs:
  restore:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 6
    steps:
      - name: Check out RONSAS control authority
        uses: actions/checkout@v4

      - name: Align installed Caddy with persistent supervisor contract
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $control=Join-Path $env:LOCALAPPDATA 'Resonance\RONS-ControlCenter'
          $controlConfig=Join-Path $control 'rons-control.json'
          $governed=Join-Path $PWD 'ops\ealiophin\edge\Caddyfile.cgnat-edge'
          if(-not (Test-Path -LiteralPath $controlConfig -PathType Leaf)){throw "Control config missing: $controlConfig"}
          if(-not (Test-Path -LiteralPath $governed -PathType Leaf)){throw "Governed Caddyfile missing: $governed"}

          $edge=(Get-Content -Raw -LiteralPath $controlConfig | ConvertFrom-Json).publicEdge
          $caddyExe=[string]$edge.caddyExe
          $installed=[string]$edge.caddyConfig
          if(-not (Test-Path -LiteralPath $caddyExe -PathType Leaf)){throw "Caddy executable missing: $caddyExe"}
          if(-not (Test-Path -LiteralPath $installed -PathType Leaf)){throw "Installed Caddy config missing: $installed"}

          & $caddyExe validate --config $governed
          if($LASTEXITCODE){throw 'Governed Caddyfile validation failed.'}

          $installedHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash
          $governedHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $governed).Hash
          Write-Host "Caddy installed SHA256=$installedHash"
          Write-Host "Caddy governed  SHA256=$governedHash"
          if($installedHash -ne $governedHash){
            $backup=$installed + '.before-persistent-spoke-' + (Get-Date -Format 'yyyyMMdd-HHmmss')
            Copy-Item -LiteralPath $installed -Destination $backup -Force
            Copy-Item -LiteralPath $governed -Destination $installed -Force
            Write-Host "Promoted governed Caddy config; backup=$backup"
          }

          & $caddyExe reload --config $installed
          if($LASTEXITCODE){throw 'Caddy reload failed.'}
          Start-Sleep -Seconds 2

          $epub=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3101/' -TimeoutSec 10
          if($epub.StatusCode -ne 200){throw "Persistent ePublisher upstream returned $($epub.StatusCode)"}
          $edgeResp=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8801/' -TimeoutSec 10
          if($edgeResp.StatusCode -ne 200){throw "ePublisher local Caddy edge returned $($edgeResp.StatusCode)"}
          Write-Host 'PASS persistent ePublisher upstream and Caddy edge'

      - name: Start existing RONS Autonomous Supervisor task
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $taskName='RONS Autonomous Supervisor'
          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          $info=Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction Stop
          Write-Host "Before: state=$($task.State) lastResult=$($info.LastTaskResult) lastRun=$($info.LastRunTime)"
          if([string]$task.State -ne 'Running'){
            Start-ScheduledTask -TaskName $taskName
          }

          $deadline=(Get-Date).AddSeconds(30)
          do{
            Start-Sleep -Seconds 2
            $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
            $supervisor=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object {[string]$_.CommandLine -like '*RONS-Supervisor.ps1*'} |
              Select-Object -First 1
            if([string]$task.State -eq 'Running' -and $supervisor){break}
          }while((Get-Date) -lt $deadline)

          if([string]$task.State -ne 'Running'){throw "Supervisor scheduled task did not stay running; state=$($task.State)"}
          if(-not $supervisor){throw 'Supervisor task is Running but RONS-Supervisor.ps1 process was not found.'}
          Write-Host "PASS supervisor running PID=$($supervisor.ProcessId)"

      - name: Wait for persistent Sync Vision and verify local edges
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          function Wait-Http([string]$Name,[string]$Url,[int]$Seconds){
            $deadline=(Get-Date).AddSeconds($Seconds)
            $last=''
            do{
              try{
                $r=Invoke-WebRequest -UseBasicParsing -Uri $Url -TimeoutSec 10
                if($r.StatusCode -eq 200){Write-Host "PASS $Name HTTP 200"; return}
                $last="HTTP $($r.StatusCode)"
              }catch{$last=$_.Exception.Message}
              Write-Host "WAIT $Name last=$last"
              Start-Sleep -Seconds 4
            }while((Get-Date) -lt $deadline)
            throw "$Name did not become healthy: $last"
          }

          Wait-Http 'Sync Vision persistent upstream' 'http://127.0.0.1:3301/' 150
          Wait-Http 'ePublisher local edge' 'http://127.0.0.1:8801/' 30
          Wait-Http 'Sync Vision local edge' 'http://127.0.0.1:8803/' 30

          $task=Get-ScheduledTask -TaskName 'RONS Autonomous Supervisor' -ErrorAction Stop
          if([string]$task.State -ne 'Running'){throw "Supervisor stopped during recovery; state=$($task.State)"}
          Write-Host 'PASS persistent supervisor remains running'

      - name: Verify public spoke recovery
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          function Wait-Public([string]$Name,[string]$Url){
            $last=''
            for($i=1;$i -le 12;$i++){
              try{
                $sep=if($Url.Contains('?')){'&'}else{'?'}
                $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                $r=Invoke-WebRequest -UseBasicParsing -Uri ($Url+$sep+'ronsas_verify='+$stamp) -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'} -TimeoutSec 15
                if($r.StatusCode -eq 200){Write-Host "PASS PUBLIC $Name HTTP 200 attempt=$i"; return}
                $last="HTTP $($r.StatusCode)"
              }catch{$last=$_.Exception.Message}
              Write-Host "WAIT PUBLIC $Name attempt=$i last=$last"
              Start-Sleep -Seconds 5
            }
            throw "$Name public verification failed: $last"
          }
          Wait-Public 'ePublisher' 'https://epublisher.reson8.life/'
          Wait-Public 'Sync Vision' 'https://sync.reson8.life/'
          Write-Host 'RONSAS PERSISTENT SPOKE RECOVERY: PASS'
