version: "0.9"
name: Resonance Sovereign Backend Runtime
mode: local-only
pull_policy: never
network:
  external: false
  internal_name: sovereign-internal
services:
  postgres:
    image: postgres:16.6-alpine
    host: 127.0.0.1
    port: 55432
    container_port: 5432
    required: true
  auth:
    image: resonance-service-auth:0.9
    host: 127.0.0.1
    port: 58080
    container_port: 8080
    required: true
  storage:
    image: resonance-service-storage:0.9
    host: 127.0.0.1
    port: 59000
    container_port: 9000
    required: true
  gateway:
    image: resonance-service-gateway:0.9
    host: 127.0.0.1
    port: 58000
    container_port: 8000
    required: true
