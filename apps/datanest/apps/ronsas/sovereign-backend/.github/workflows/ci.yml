name: CI

# This private source repository currently has no GitHub-hosted runner assigned.
# Automatic pull_request/push runs therefore fail before step 1 and create
# false-negative notification noise. Cross-repository backend + Hub acceptance
# is governed from resonance36912-cell/RONSAS on Ealiophin against exact SHAs.
#
# Keep this workflow available for an operator-triggered diagnostic once a
# compatible runner is assigned to this repository; do not treat an absent
# backend-local run as evidence that validation passed.
on:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q services
      - run: python -m pytest -q
