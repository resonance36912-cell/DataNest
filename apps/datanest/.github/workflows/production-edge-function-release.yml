name: Governed Production Edge Function Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA reachable from main
        required: true
        type: string
      gate_timeframe_override_hours:
        description: Optional Owner worktree-gate planning-window override in hours (0.5-72)
        required: false
        type: string
      release_mode:
        description: Progressive live is the default; protected retains the existing environment
        required: true
        default: progressive_live
        type: choice
        options:
          - progressive_live
          - protected

permissions:
  contents: read

concurrency:
  group: governed-production-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy governed Edge Functions from exact release SHA
    environment:
      name: ${{ inputs.release_mode == 'progressive_live' && 'github-pages-progressive-live' || 'github-pages' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATANEST_RELEASE_SHA: ${{ inputs.release_sha }}
      DATANEST_SUPABASE_PROJECT: sgqdmfgjbprsoqsmgigi
      DATANEST_CONNECTOR_ATTESTATION_FILE: config/production-edge-function-connector-attestation.json
      DATANEST_CONNECTOR_ATTESTATION_MAX_AGE_HOURS: "24"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact SHA is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DATANEST_RELEASE_SHA"
          git fetch origin main --no-tags --prune
          git merge-base --is-ancestor "$DATANEST_RELEASE_SHA" origin/main

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - uses: supabase/setup-cli@v3
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        with:
          version: 2.118.0

      - name: Validate governed Edge Function bundles
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            datanest-ai-chat
            datanest-ai-intake
            datanest-ai-certification
            manage-ai-provider-v2
            send-job-invite
            send-project-member-invite
            ronsas-status
            external-audit
          )
          for function in "${functions[@]}"; do
            dir="supabase/functions/$function"
            if [ -f "$dir/deno.json" ]; then
              deno check --config "$dir/deno.json" "$dir/index.ts"
            else
              deno check "$dir/index.ts"
            fi
          done

      - name: Verify connector-attested production state
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' && inputs.release_mode == 'protected' }}
        run: node scripts/verify-production-edge-function-connector-attestation.mjs "$DATANEST_CONNECTOR_ATTESTATION_FILE"

      - name: Record missing deployment credential as a progressive-live gap
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' && inputs.release_mode == 'progressive_live' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .datanest
          node <<'NODE'
          const fs=require("fs");
          const now=new Date();
          fs.writeFileSync(".datanest/edge-function-release.json",JSON.stringify({
            schemaVersion:"edge-function-release-attestation-v2",
            status:"pending",
            source:"github-actions",
            verifiedAt:now.toISOString(),
            sourceCommit:process.env.DATANEST_RELEASE_SHA,
            sourceTreeSha256:null,
            workflowRunId:Number(process.env.GITHUB_RUN_ID),
            deployment:{status:"not_run",reason:"SUPABASE_ACCESS_TOKEN is unavailable to this GitHub Actions run"},
            gap:{
              id:"technical:edge-deployment-credential",
              blocking:false,
              proposedDeadlineHours:48,
              proposedDeadline:new Date(now.getTime()+48*3600000).toISOString(),
              remedy:"Provide the authorized Supabase deployment credential or an equivalent governed deployment mechanism."
            }
          },null,2)+"\n");
          NODE
          echo "::warning::Progressive-live Edge Function deployment was not executed because SUPABASE_ACCESS_TOKEN is unavailable; gap recorded with a 48-hour proposed remedy deadline."

      - name: Deploy governed Edge Functions from exact checkout
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            datanest-ai-chat
            datanest-ai-intake
            datanest-ai-certification
            manage-ai-provider-v2
            send-job-invite
            send-project-member-invite
            ronsas-status
            external-audit
          )
          for function in "${functions[@]}"; do
            echo "::group::Deploy $function"
            supabase functions deploy "$function" \
              --project-ref "$DATANEST_SUPABASE_PROJECT" \
              --use-docker
            echo "::endgroup::"
          done

      - name: Write production Edge Function release attestation
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          mkdir -p .datanest
          node scripts/write-production-edge-function-release-attestation.mjs .datanest/edge-function-release.json

      - name: Preserve production Edge Function release evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: datanest-edge-function-release-${{ inputs.release_sha }}
          path: .datanest/edge-function-release.json
          if-no-files-found: warn
          retention-days: 90

  gate-timeframe:
    name: DataNest AI worktree gate timeframe
    uses: ./.github/workflows/worktree-gate-timeframe.yml
    with:
      gate_id: "production-edge-function-release"
      override_hours: ${{ inputs.gate_timeframe_override_hours || '' }}
