name: RONSAS Bun app validation
description: Install and validate a Bun-based RONSAS application.
inputs:
  working-directory:
    description: RONSAS application directory.
    required: false
    default: apps/ronsas/youtube-optimizer
  bun-version:
    description: Bun version to install.
    required: false
    default: "1.3.14"
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile
    - name: Type-check, test, and build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun run typecheck && bun run test && bun run build
