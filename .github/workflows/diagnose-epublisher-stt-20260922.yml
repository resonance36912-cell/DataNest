name: Recover ePublisher STT 502

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-epublisher-stt-20260922.yml"

permissions:
  contents: read
  issues: write

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 15
    steps:
      - name: Check out RONSAS control authority
        uses: actions/checkout@v5

      - name: Recover dedicated ePublisher STT if absent
        id: recover
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:USERPROFILE 'Resonance\OpenNova'
          $runtime = Join-Path $root 'runtime'
          $logs = Join-Path $runtime 'logs\rons-cluster'
          $python = Join-Path $runtime 'python-envs\epublisher-stt\Scripts\python.exe'
          $script = Join-Path $runtime 'syncvision-local-stt.py'
          $modelRoot = Join-Path $runtime 'models'
          $result = [ordered]@{}

          function Probe([string]$Name,[string]$Uri,[int]$Timeout=12) {
            try {
              $r=Invoke-WebRequest -UseBasicParsing -Uri $Uri -TimeoutSec $Timeout
              $result[$Name]=[ordered]@{status=[int]$r.StatusCode;ok=$true;detail=([string]$r.Content).Substring(0,[Math]::Min(800,([string]$r.Content).Length))}
              return $true
            } catch {
              $status=$null
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) { try {$status=[int]$_.Exception.Response.StatusCode.value__} catch {} }
              $result[$Name]=[ordered]@{status=$status;ok=$false;detail=[string]$_.Exception.Message}
              return $false
            }
          }

          $healthy = Probe 'before_direct_health' 'http://127.0.0.1:7869/health'
          if (-not $healthy) {
            if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw "Missing governed STT Python: $python" }
            if (-not (Test-Path -LiteralPath $script -PathType Leaf)) { throw "Missing governed STT script: $script" }
            New-Item -ItemType Directory -Force -Path $logs | Out-Null
            $stamp=Get-Date -Format 'yyyyMMdd-HHmmss'
            $outLog=Join-Path $logs ("epublisher-stt-recovery-$stamp.out.log")
            $errLog=Join-Path $logs ("epublisher-stt-recovery-$stamp.err.log")
            $priorPort=$env:RONS_STT_PORT
            $priorModels=$env:RONS_STT_MODELS_ROOT
            $priorXet=$env:HF_HUB_DISABLE_XET
            $priorTracking=$env:RUNNER_TRACKING_ID
            try {
              $env:RONS_STT_PORT='7869'
              $env:RONS_STT_MODELS_ROOT=$modelRoot
              $env:HF_HUB_DISABLE_XET='1'
              $env:RUNNER_TRACKING_ID=''
              $proc=Start-Process -FilePath $python -ArgumentList @($script) -WorkingDirectory $runtime -RedirectStandardOutput $outLog -RedirectStandardError $errLog -WindowStyle Hidden -PassThru
              $result.started_pid=[int]$proc.Id
              $result.recovery_out_log=$outLog
              $result.recovery_err_log=$errLog
            } finally {
              $env:RONS_STT_PORT=$priorPort
              $env:RONS_STT_MODELS_ROOT=$priorModels
              $env:HF_HUB_DISABLE_XET=$priorXet
              $env:RUNNER_TRACKING_ID=$priorTracking
            }
            $deadline=(Get-Date).AddSeconds(90)
            do { Start-Sleep -Milliseconds 750; $healthy=Probe 'startup_direct_health' 'http://127.0.0.1:7869/health' } while (-not $healthy -and (Get-Date) -lt $deadline)
            if (-not $healthy) {
              if (Test-Path -LiteralPath $errLog) { $result.startup_stderr=(Get-Content -LiteralPath $errLog -Tail 100 | Out-String) }
              throw 'Dedicated ePublisher STT did not become healthy on port 7869.'
            }
          }

          Probe 'local_proxy_health' 'http://127.0.0.1:3101/open-nova-stt/health' | Out-Null
          Probe 'public_proxy_health' 'https://epublisher.reson8.life/open-nova-stt/health' | Out-Null

          $payload=@{url='https://www.youtube.com/watch?v=CxKEyVgYBpk';mode='fast'} | ConvertTo-Json -Compress
          try {
            $r=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:7869/transcribe-url' -Method POST -ContentType 'application/json' -Body $payload -TimeoutSec 420
            $obj=$r.Content | ConvertFrom-Json
            $result.direct_transcribe=[ordered]@{status=[int]$r.StatusCode;ok=$true;text_length=([string]$obj.text).Length;provider=[string]$obj.quality.provider}
          } catch {
            $status=$null;$detail=[string]$_.Exception.Message
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              try {$status=[int]$_.Exception.Response.StatusCode.value__} catch {}
              try {$reader=New-Object IO.StreamReader($_.Exception.Response.GetResponseStream());$raw=$reader.ReadToEnd();$reader.Dispose();if($raw){$detail=$raw.Substring(0,[Math]::Min(1200,$raw.Length))}} catch {}
            }
            $result.direct_transcribe=[ordered]@{status=$status;ok=$false;detail=$detail}
          }

          $compact=$result | ConvertTo-Json -Depth 8 -Compress
          "diagnostic_json=$compact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish recovery receipt
        if: always()
        uses: actions/github-script@v8
        env:
          DIAGNOSTIC_JSON: ${{ steps.recover.outputs.diagnostic_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const data = process.env.DIAGNOSTIC_JSON || "{}";
            const body = ["EPUBLISHER_STT_RECOVERY", "", "Run: " + context.runId, "SHA: " + context.sha, "", data].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});
