name: Diagnose ePublisher STT 502

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-epublisher-stt-20260922.yml"

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 10
    steps:
      - name: Check out RONSAS control authority
        uses: actions/checkout@v5

      - name: Inspect ePublisher STT process and logs
        id: probe
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference = 'Continue'
          $root = Join-Path $env:USERPROFILE 'Resonance\OpenNova'
          $runtime = Join-Path $root 'runtime'
          $logs = Join-Path $runtime 'logs\rons-cluster'
          $python = Join-Path $runtime 'python-envs\epublisher-stt\Scripts\python.exe'
          $script = Join-Path $runtime 'syncvision-local-stt.py'
          $result = [ordered]@{}

          $listener = Get-NetTCPConnection -LocalPort 7869 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
          $result.listener = if ($listener) { [ordered]@{ address=[string]$listener.LocalAddress; pid=[int]$listener.OwningProcess } } else { $null }
          $result.python_exists = Test-Path -LiteralPath $python -PathType Leaf
          $result.script_exists = Test-Path -LiteralPath $script -PathType Leaf
          if ($result.python_exists) {
            try { $result.python_version = (& $python --version 2>&1 | Out-String).Trim() } catch { $result.python_version = $_.Exception.Message }
          }

          foreach ($name in @('epublisher-stt.err.log','epublisher-stt.out.log','local-stt.err.log','local-stt.out.log')) {
            $path = Join-Path $logs $name
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $text = (Get-Content -LiteralPath $path -Tail 120 -ErrorAction SilentlyContinue | Out-String)
              if ($text.Length -gt 10000) { $text = $text.Substring($text.Length - 10000) }
              $result[$name] = $text
            } else {
              $result[$name] = '<missing>'
            }
          }

          $compact = $result | ConvertTo-Json -Depth 6 -Compress
          "diagnostic_json=$compact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish sanitized diagnostic receipt
        if: always()
        uses: actions/github-script@v8
        env:
          DIAGNOSTIC_JSON: ${{ steps.probe.outputs.diagnostic_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const data = process.env.DIAGNOSTIC_JSON || "{}";
            const body = ["EPUBLISHER_STT_LOG_DIAGNOSTIC", "", "Run: " + context.runId, "SHA: " + context.sha, "", data].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});
