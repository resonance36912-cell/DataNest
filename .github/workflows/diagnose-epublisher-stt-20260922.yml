name: Diagnose ePublisher STT 502

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-epublisher-stt-20260922.yml"

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin]
    timeout-minutes: 15
    steps:
      - name: Check out RONSAS control authority
        uses: actions/checkout@v5

      - name: Probe Ealiophin host from governed Linux runner
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/epublisher-stt-probe.py <<'PY'
          import json, urllib.request, urllib.error

          VIDEO = 'https://www.youtube.com/watch?v=CxKEyVgYBpk'
          results = {}

          def request(name, url, method='GET', payload=None, timeout=20):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method, headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      raw = resp.read().decode('utf-8','replace')
                      item = {'status': resp.status, 'ok': True}
                      if name.endswith('transcribe'):
                          try:
                              obj = json.loads(raw)
                          except Exception:
                              obj = {}
                          item['text_length'] = len(str(obj.get('text') or ''))
                          q = obj.get('quality') or {}
                          item['provider'] = q.get('provider')
                      else:
                          item['detail'] = raw[:800]
                      results[name] = item
                      return True
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8','replace')
                  results[name] = {'status': exc.code, 'ok': False, 'detail': raw[:1200]}
              except Exception as exc:
                  results[name] = {'status': None, 'ok': False, 'detail': str(exc)[:1200]}
              return False

          hosts = ['host.containers.internal', 'host.docker.internal']
          chosen = None
          for host in hosts:
              key = 'direct_health_' + host.replace('.','_')
              if request(key, f'http://{host}:7869/health'):
                  chosen = host
                  break

          request('public_proxy_health', 'https://epublisher.reson8.life/open-nova-stt/health')
          if chosen:
              request('direct_transcribe', f'http://{chosen}:7869/transcribe-url', method='POST', payload={'url': VIDEO, 'mode':'fast'}, timeout=420)
              request('local_proxy_health', f'http://{chosen}:3101/open-nova-stt/health')
          else:
              results['direct_transcribe'] = {'status': None, 'ok': False, 'detail':'No governed host alias reached port 7869'}

          print(json.dumps(results, separators=(',',':')))
          PY

          podman --remote run --rm -i --entrypoint python3 \
            -v /tmp/epublisher-stt-probe.py:/probe.py:ro \
            localhost/ronsas-actions-runner:2.337.0-r2 /probe.py > /tmp/epublisher-stt-result.json
          cat /tmp/epublisher-stt-result.json
          {
            echo 'diagnostic_json<<EOF'
            cat /tmp/epublisher-stt-result.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish sanitized diagnostic receipt
        if: always()
        uses: actions/github-script@v8
        env:
          DIAGNOSTIC_JSON: ${{ steps.probe.outputs.diagnostic_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const data = process.env.DIAGNOSTIC_JSON || "{}";
            const body = ["EPUBLISHER_STT_DIAGNOSTIC", "", "Run: " + context.runId, "SHA: " + context.sha, "", data].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});
