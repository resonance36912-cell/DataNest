name: Diagnose ePublisher STT 502

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-epublisher-stt-20260922.yml"

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 15
    steps:
      - name: Check out RONSAS control authority
        uses: actions/checkout@v4

      - name: Probe ePublisher STT boundaries
        id: probe
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference = 'Continue'
          $videoUrl = 'https://www.youtube.com/watch?v=CxKEyVgYBpk'
          $results = [ordered]@{}

          function Invoke-HealthProbe([string]$Name, [string]$Uri) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $Uri -TimeoutSec 15
              $body = [string]$response.Content
              if ($body.Length -gt 800) { $body = $body.Substring(0, 800) }
              $results[$Name] = [ordered]@{ status = [int]$response.StatusCode; ok = $true; detail = $body }
            } catch {
              $status = $null
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                try { $status = [int]$_.Exception.Response.StatusCode.value__ } catch {}
              }
              $results[$Name] = [ordered]@{ status = $status; ok = $false; detail = [string]$_.Exception.Message }
            }
          }

          Invoke-HealthProbe 'direct_health' 'http://127.0.0.1:7869/health'
          Invoke-HealthProbe 'local_proxy_health' 'http://127.0.0.1:3101/open-nova-stt/health'
          Invoke-HealthProbe 'public_proxy_health' 'https://epublisher.reson8.life/open-nova-stt/health'

          $payload = @{ url = $videoUrl; mode = 'fast' } | ConvertTo-Json -Compress
          try {
            $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:7869/transcribe-url' -Method POST -ContentType 'application/json' -Body $payload -TimeoutSec 420
            $parsed = $null
            try { $parsed = $response.Content | ConvertFrom-Json } catch {}
            $textLength = 0
            $provider = $null
            if ($parsed -and $parsed.text) { $textLength = ([string]$parsed.text).Length }
            if ($parsed -and $parsed.quality -and $parsed.quality.provider) { $provider = [string]$parsed.quality.provider }
            $results['direct_transcribe'] = [ordered]@{ status = [int]$response.StatusCode; ok = $true; text_length = $textLength; provider = $provider }
          } catch {
            $status = $null
            $detail = [string]$_.Exception.Message
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              try { $status = [int]$_.Exception.Response.StatusCode.value__ } catch {}
              try {
                $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
                $raw = $reader.ReadToEnd()
                $reader.Dispose()
                if ($raw) {
                  if ($raw.Length -gt 1200) { $raw = $raw.Substring(0,1200) }
                  $detail = $raw
                }
              } catch {}
            }
            $results['direct_transcribe'] = [ordered]@{ status = $status; ok = $false; detail = $detail }
          }

          $compact = $results | ConvertTo-Json -Depth 8 -Compress
          "diagnostic_json=$compact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish sanitized diagnostic receipt
        if: always()
        uses: actions/github-script@v8
        env:
          DIAGNOSTIC_JSON: ${{ steps.probe.outputs.diagnostic_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const data = process.env.DIAGNOSTIC_JSON || "{}";
            const body = ["EPUBLISHER_STT_DIAGNOSTIC", "", "Run: " + context.runId, "SHA: " + context.sha, "", data].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 273,
              body,
            });
