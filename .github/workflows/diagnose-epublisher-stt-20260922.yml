name: Diagnose ePublisher STT 502

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-epublisher-stt-20260922.yml"

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin]
    timeout-minutes: 10
    steps:
      - name: Check out RONSAS control authority
        uses: actions/checkout@v5

      - name: Inspect governed ePublisher STT runtime files and logs
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/epublisher-stt-log-probe.sh <<'SH'
          set -eu
          echo '=== runtime existence ==='
          for p in \
            /runtime/syncvision-local-stt.py \
            /runtime/python-envs/epublisher-stt/Scripts/python.exe \
            /logs/epublisher-stt.out.log \
            /logs/epublisher-stt.err.log \
            /logs/local-stt.out.log \
            /logs/local-stt.err.log; do
            if [ -e "$p" ]; then
              ls -l "$p"
            else
              echo "MISSING $p"
            fi
          done
          echo '=== epublisher-stt stderr tail ==='
          if [ -f /logs/epublisher-stt.err.log ]; then tail -n 120 /logs/epublisher-stt.err.log; fi
          echo '=== epublisher-stt stdout tail ==='
          if [ -f /logs/epublisher-stt.out.log ]; then tail -n 80 /logs/epublisher-stt.out.log; fi
          echo '=== local-stt stderr tail ==='
          if [ -f /logs/local-stt.err.log ]; then tail -n 80 /logs/local-stt.err.log; fi
          SH

          podman --remote run --rm -i --entrypoint sh \
            -v /mnt/c/Users/Ashley/Resonance/OpenNova/runtime:/runtime:ro \
            -v /mnt/c/Users/Ashley/Resonance/OpenNova/runtime/logs/rons-cluster:/logs:ro \
            localhost/ronsas-actions-runner:2.337.0-r2 -s < /tmp/epublisher-stt-log-probe.sh > /tmp/epublisher-stt-log-result.txt
          cat /tmp/epublisher-stt-log-result.txt
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/epublisher-stt-log-result.txt')
          s=p.read_text(encoding='utf-8',errors='replace')
          print(json.dumps({'log_excerpt':s[-12000:]},separators=(',',':')))
          PY
          python3 - <<'PY' > /tmp/diagnostic.json
          import json, pathlib
          s=pathlib.Path('/tmp/epublisher-stt-log-result.txt').read_text(encoding='utf-8',errors='replace')
          print(json.dumps({'log_excerpt':s[-12000:]},separators=(',',':')))
          PY
          {
            echo 'diagnostic_json<<EOF'
            cat /tmp/diagnostic.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish sanitized diagnostic receipt
        if: always()
        uses: actions/github-script@v8
        env:
          DIAGNOSTIC_JSON: ${{ steps.probe.outputs.diagnostic_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const data = process.env.DIAGNOSTIC_JSON || "{}";
            const body = ["EPUBLISHER_STT_LOG_DIAGNOSTIC", "", "Run: " + context.runId, "SHA: " + context.sha, "", data].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});
