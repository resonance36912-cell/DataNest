name: Verify governance database runtime

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/verify-governance-db.sql"
      - ".github/workflows/verify-governance-db.yml"
      - "src/lib/governance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-db-runtime:
    name: Supabase governance migration + RPC runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Verify governance schema, RLS, RPCs, and transaction flow
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/verify-governance-db.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
