name: Verify governance database runtime

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/verify-governance-bootstrap.sql"
      - "scripts/verify-governance-db.sql"
      - "scripts/verify-governance-runtime.py"
      - ".github/workflows/verify-governance-db.yml"
      - "src/lib/governance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-db-runtime:
    name: Supabase governance migration + RPC runtime
    # Local Supabase requires nested/rootful container features that the sovereign
    # rootless runner intentionally does not expose. Use an ephemeral hosted runner
    # for this isolated migration/RPC certification job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify sovereign runner Python 3.12
        run: |
          python --version
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Verify governance migrations on sovereign PostgreSQL 17
        env:
          PODMAN_API_URL: http://ronsas-podman-api:2375
        run: python scripts/verify-governance-runtime.py
