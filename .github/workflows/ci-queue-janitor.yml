name: CI queue janitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-queue-janitor.yml"

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale CI and superseded recovery runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const active = new Set(["queued", "pending", "waiting", "in_progress", "requested"]);
            const linuxCi = new Set([
              "Security scan",
              "Verify prebuild",
              "Verify checkout links",
              "Verify ePublisher checkout",
            ]);
            const recovery = new Set([
              "Governed Linux runner recovery",
              "Guarded zombie Linux runner recycle",
              "Temporary format free promotion",
            ]);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const currentPrByBranch = new Map(
              pulls.map((pr) => [pr.head.ref, { number: pr.number, sha: pr.head.sha }]),
            );

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
            });

            let cancelled = 0;
            for (const run of runs) {
              if (!active.has(run.status)) continue;
              if (run.id === context.runId) continue;

              let reason = null;
              if (linuxCi.has(run.name)) {
                if (run.event === "pull_request") {
                  const current = currentPrByBranch.get(run.head_branch ?? "");
                  if (!current) {
                    reason = "closed or unmatched PR branch";
                  } else if (run.head_sha !== current.sha) {
                    reason = `superseded PR #${current.number} head`;
                  }
                } else if (run.event === "push" && run.head_branch === "main") {
                  reason = "main push CI is superseded by PR exact-head validation";
                }
              } else if (recovery.has(run.name)) {
                reason = "superseded recovery/formatter run";
              }

              if (!reason) continue;
              core.info(`Cancelling run ${run.id} (${run.name}): ${reason}`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                cancelled += 1;
              } catch (error) {
                core.warning(`Could not cancel run ${run.id}: ${error.message}`);
              }
            }

            core.info(`Cancelled ${cancelled} stale/superseded run(s).`);

      - name: Dispatch fresh governed Linux runner recovery
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "windows-recover-linux-runner.yml",
              ref: "main",
            });
            core.info("Dispatched governed Linux runner recovery.");
