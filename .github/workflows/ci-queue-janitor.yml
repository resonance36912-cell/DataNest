name: CI queue janitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-queue-janitor.yml"

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: ronsas-ci-queue-janitor
  cancel-in-progress: true

jobs:
  prune:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Prune stale CI queue and dispatch recovery
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GH_REPOSITORY
          $currentRunId = [long]$env:GH_RUN_ID

          $openPullsRaw = & gh.exe api "repos/$repo/pulls?state=open&per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query open pull requests.' }
          $openPulls = @($openPullsRaw | ConvertFrom-Json)

          $currentPrByBranch = @{}
          foreach ($pr in $openPulls) {
            $branch = [string]$pr.head.ref
            $sha = [string]$pr.head.sha
            if ([string]::IsNullOrWhiteSpace($branch) -or [string]::IsNullOrWhiteSpace($sha)) { continue }
            $currentPrByBranch[$branch] = [pscustomobject]@{
              number = [int]$pr.number
              sha = $sha
            }
          }

          $runsRaw = & gh.exe api "repos/$repo/actions/runs?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query workflow runs.' }
          $runs = @(($runsRaw | ConvertFrom-Json).workflow_runs)

          $active = @('queued','pending','waiting','in_progress','requested')
          $linuxCi = @(
            'Security scan',
            'Verify prebuild',
            'Verify checkout links',
            'Verify ePublisher checkout'
          )
          $recovery = @(
            'Governed Linux runner recovery',
            'Guarded zombie Linux runner recycle',
            'Temporary format free promotion'
          )

          $cancelled = 0
          foreach ($run in $runs) {
            if ($active -notcontains [string]$run.status) { continue }
            if ([long]$run.id -eq $currentRunId) { continue }

            $reason = $null
            $name = [string]$run.name
            $event = [string]$run.event
            $headBranch = [string]$run.head_branch
            $headSha = [string]$run.head_sha

            if ($linuxCi -contains $name) {
              if ($event -eq 'pull_request') {
                if (-not $currentPrByBranch.ContainsKey($headBranch)) {
                  $reason = 'closed or unmatched PR branch'
                } else {
                  $current = $currentPrByBranch[$headBranch]
                  if ($headSha -ne [string]$current.sha) {
                    $reason = "superseded PR #$($current.number) head"
                  }
                }
              } elseif ($event -eq 'push' -and $headBranch -eq 'main') {
                $reason = 'main push CI superseded by exact-head PR validation'
              }
            } elseif ($recovery -contains $name) {
              $reason = 'superseded recovery or formatter run'
            }

            if ([string]::IsNullOrWhiteSpace($reason)) { continue }

            Write-Host "Cancelling run=$($run.id) name=$name reason=$reason"
            & gh.exe api -X POST "repos/$repo/actions/runs/$($run.id)/cancel" *> $null
            if ($LASTEXITCODE -eq 0) {
              $cancelled++
            } else {
              Write-Warning "Run $($run.id) could not be cancelled; it may have completed concurrently."
            }
          }

          Write-Host "cancelled=$cancelled"

          & gh.exe api -X POST "repos/$repo/actions/workflows/windows-recover-linux-runner.yml/dispatches" -f ref=main *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Unable to dispatch governed Linux runner recovery.' }
          Write-Host 'dispatched governed Linux runner recovery'
