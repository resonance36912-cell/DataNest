name: CI queue janitor

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: ronsas-ci-queue-janitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prune:
    # Queue control must not depend on the self-hosted runners it may need to recover.
    # This job manages only GitHub Actions metadata; RONSAS runtime/build authority remains local.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prune stale CI queue and dispatch governed recovery
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const targetNames = new Set([
              "Security scan",
              "Verify prebuild",
              "Verify checkout links",
              "Verify ePublisher checkout",
            ]);
            const recoveryNames = new Set([
              "Governed Linux runner recovery",
              "Guarded zombie Linux runner recycle",
              "Temporary format free promotion",
            ]);
            const activeStates = new Set([
              "queued",
              "pending",
              "waiting",
              "in_progress",
              "requested",
            ]);
            const currentRun = Number(context.runId);

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const openByHead = new Map(
              openPulls.map((pr) => [
                pr.head.ref,
                { number: pr.number, sha: pr.head.sha },
              ]),
            );

            const { data: runsPage } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const runs = runsPage.workflow_runs;

            let cancelled = 0;
            for (const run of runs) {
              if (!activeStates.has(run.status) || run.id === currentRun) continue;

              let reason = null;
              if (targetNames.has(run.name)) {
                if (run.event === "pull_request") {
                  const current = openByHead.get(run.head_branch || "");
                  if (!current) {
                    reason = "closed or unmatched PR branch";
                  } else if (run.head_sha !== current.sha) {
                    reason = `superseded PR #${current.number} head`;
                  }
                } else if (run.event === "push" && run.head_branch === "main") {
                  reason = "main push CI superseded by exact-head PR validation";
                }
              } else if (recoveryNames.has(run.name)) {
                reason = "superseded recovery or formatter run";
              }

              if (!reason) continue;
              core.info(`Cancelling run=${run.id} name=${run.name} reason=${reason}`);
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                cancelled += 1;
              } catch (error) {
                core.warning(
                  `Run ${run.id} could not be cancelled; it may have completed concurrently: ${error.status || "error"} ${error.message}`,
                );
              }
            }

            core.info(`cancelled=${cancelled}`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "windows-recover-linux-runner.yml",
              ref: "main",
            });
            core.info("dispatched governed Linux runner recovery");
