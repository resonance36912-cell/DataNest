name: Validate supervisor runner failsafe hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "ops/ealiophin/ci/INSTALL-RONSAS-WINDOWS-RUNNER.ps1"
      - "ops/ealiophin/control-center/RONS-Supervisor.ps1"
      - "scripts/lib/supervisor-github-runner-failsafe.test.ts"
      - ".github/workflows/validate-supervisor-runner-failsafe-hosted.yml"

permissions:
  contents: read

concurrency:
  group: supervisor-runner-failsafe-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkout-smoke:
    name: Hosted checkout smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify target files
        run: |
          test -f ops/ealiophin/ci/INSTALL-RONSAS-WINDOWS-RUNNER.ps1
          test -f ops/ealiophin/control-center/RONS-Supervisor.ps1
          test -f scripts/lib/supervisor-github-runner-failsafe.test.ts

  powershell-parse:
    name: Hosted PowerShell parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse governed PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @(
            'ops/ealiophin/ci/INSTALL-RONSAS-WINDOWS-RUNNER.ps1',
            'ops/ealiophin/control-center/RONS-Supervisor.ps1'
          )){
            [void][scriptblock]::Create((Get-Content -Raw -LiteralPath $path))
            Write-Host "POWERSHELL_PARSE_PASS=$path"
          }

  bun-regression:
    name: Hosted supervisor Bun regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
          no-cache: true
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Run focused supervisor recovery regression
        run: bun test scripts/lib/supervisor-github-runner-failsafe.test.ts
