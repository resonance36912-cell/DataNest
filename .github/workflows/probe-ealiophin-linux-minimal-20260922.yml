name: Probe Ealiophin Linux runner minimal labels 2026-09-22

on:
  push:
    branches:
      - ronsas/switch-epublisher-root-to-railway-fallback-20260922
    paths:
      - ".github/workflows/probe-ealiophin-linux-minimal-20260922.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Prove the minimal-label Linux lane is the governed Ealiophin runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          hostname || true
          if [ "$RUNNER_NAME" != "Ealiophin-RONSAS-Linux-2" ]; then
            echo "unexpected runner: $RUNNER_NAME" >&2
            exit 2
          fi
          echo "MINIMAL LABEL LINUX LANE: PASS"
