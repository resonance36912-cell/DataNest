name: Temporary format free promotion

on:
  push:
    branches:
      - ronsas/free-promotion-20260920
    paths:
      - ".github/workflows/temp-format-free-promotion.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin]
    timeout-minutes: 10
    steps:
      - name: Check out promotion branch
        uses: actions/checkout@v5
        with:
          ref: ronsas/free-promotion-20260920
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format promotion delta
        run: |
          bunx prettier --write             public/content/updates.json             scripts/lib/free-promotion-invariants.test.ts             scripts/verify-pricing-packs.ts             scripts/verify-pricing.ts             src/lib/checkout.functions.ts             src/lib/commercial-policy.ts             src/lib/entitlement.functions.ts             src/lib/requireTier-request.ts             src/routes/account.billing.tsx             src/routes/account.subscriptions.tsx             src/routes/api/public/entitlement.ts             src/routes/checkout.tsx             src/routes/index.tsx             src/routes/pricing.tsx

      - name: Commit formatter-only changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "formatter_changes=none"
            exit 0
          fi
          git config user.name "RONSAS CI"
          git config user.email "resonance.36912@gmail.com"
          git add             public/content/updates.json             scripts/lib/free-promotion-invariants.test.ts             scripts/verify-pricing-packs.ts             scripts/verify-pricing.ts             src/lib/checkout.functions.ts             src/lib/commercial-policy.ts             src/lib/entitlement.functions.ts             src/lib/requireTier-request.ts             src/routes/account.billing.tsx             src/routes/account.subscriptions.tsx             src/routes/api/public/entitlement.ts             src/routes/checkout.tsx             src/routes/index.tsx             src/routes/pricing.tsx
          git commit -m "style: format free-promotion delta"
          git push origin HEAD:ronsas/free-promotion-20260920
