name: Governed Windows Hub promotion

on:
  push:
    branches: [main]
    paths:
      - "ops/release-requests/hub-production.json"

permissions:
  contents: read

concurrency:
  group: ronsas-windows-hub-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 45
    environment: production
    steps:
      - name: Check out RONSAS control authority
        uses: actions/checkout@v4

      - name: Read and validate governed release request
        id: request
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $r = Get-Content -Raw -LiteralPath 'ops/release-requests/hub-production.json' | ConvertFrom-Json
          if ([string]$r.schema -ne 'ronsas-hub-release-request/v1') { throw 'Invalid release request schema.' }
          if ([string]$r.sourceRepo -ne 'resonance36912-cell/resonance-hub') { throw 'Unexpected Hub source repository.' }
          if ([string]$r.sourceBranch -ne 'ronsas/ealiophin-production') { throw 'Unexpected Hub production branch.' }
          if ([string]$r.confirmation -ne 'PROMOTE RONSAS HUB') { throw 'Explicit promotion confirmation missing.' }
          if ([string]$r.commit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid Hub commit SHA.' }
          "commit=$($r.commit)" >> $env:GITHUB_OUTPUT

      - name: Prepare exact Hub source in isolated worktree
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $Hub='C:\Resonance\Sources\ronsas-hub-canonical'
          $Commit='${{ steps.request.outputs.commit }}'
          $Short=$Commit.Substring(0,7)
          $ReleaseRoot='C:\Resonance\Sources\release-worktrees'
          $Worktree=Join-Path $ReleaseRoot ("hub-" + $Short)
          New-Item -ItemType Directory -Force -Path $ReleaseRoot | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $Hub '.git'))) { throw "Canonical Hub git checkout missing: $Hub" }
          if (@(& git -C $Hub status --porcelain).Count -gt 0) { throw 'Canonical Hub source is dirty; refusing release.' }
          & git -C $Hub fetch origin ronsas/ealiophin-production
          if ($LASTEXITCODE -ne 0) { throw 'Hub production branch fetch failed.' }
          $remote = (& git -C $Hub rev-parse 'origin/ronsas/ealiophin-production').Trim()
          if ($remote -ne $Commit) { throw "Release request commit is not current production head: requested=$Commit remote=$remote" }
          & git -C $Hub worktree prune
          if (Test-Path -LiteralPath $Worktree) {
            & git -C $Hub worktree remove --force $Worktree 2>$null
            if (Test-Path -LiteralPath $Worktree) { Remove-Item -Recurse -Force -LiteralPath $Worktree }
          }
          & git -C $Hub worktree add --detach $Worktree $Commit
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create isolated Hub worktree.' }
          $envFile=Join-Path $Hub '.env.local'
          if (-not (Test-Path -LiteralPath $envFile -PathType Leaf)) { throw 'Production Hub .env.local missing.' }
          "RONSAS_HUB_WORKTREE=$Worktree" >> $env:GITHUB_ENV
          "RONSAS_HUB_SOURCE=$Hub" >> $env:GITHUB_ENV
          "RONSAS_HUB_ENV=$envFile" >> $env:GITHUB_ENV

      - name: Build and verify isolated candidate
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:RONSAS_HUB_WORKTREE
          try {
            & bun install --frozen-lockfile
            if ($LASTEXITCODE) { throw 'bun install failed' }
            & bun run prebuild
            if ($LASTEXITCODE) { throw 'prebuild failed' }
            & bun test
            if ($LASTEXITCODE) { throw 'tests failed' }
            & bun run typecheck
            if ($LASTEXITCODE) { throw 'typecheck failed' }

            # Keep production runtime environment out of unit tests. Bun auto-loads
            # .env.local, so link it only after tests/typecheck have passed.
            $linkedEnv=Join-Path $env:RONSAS_HUB_WORKTREE '.env.local'
            if (Test-Path -LiteralPath $linkedEnv) { Remove-Item -Force -LiteralPath $linkedEnv }
            New-Item -ItemType HardLink -Path $linkedEnv -Target $env:RONSAS_HUB_ENV | Out-Null

            $env:RONS_LOCAL_OUTPUT_DIR='.output-candidate-local'
            & bun run build:local
            if ($LASTEXITCODE) { throw 'local candidate build failed' }
          } finally {
            Pop-Location
          }

      - name: Stage candidate beside live bundle
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $From=Join-Path $env:RONSAS_HUB_WORKTREE '.output-candidate-local'
          $To=Join-Path $env:RONSAS_HUB_SOURCE '.output-candidate-local'
          if (-not (Test-Path -LiteralPath (Join-Path $From 'server\index.mjs'))) { throw 'Built candidate entry missing.' }
          if (Test-Path -LiteralPath $To) { Remove-Item -Recurse -Force -LiteralPath $To }
          New-Item -ItemType Directory -Force -Path $To | Out-Null
          & robocopy $From $To /MIR /NFL /NDL /NJH /NJS /NP
          $copyCode=$LASTEXITCODE
          if ($copyCode -gt 7) { throw "Candidate staging failed with robocopy code $copyCode" }
          $global:LASTEXITCODE=0

      - name: Validate and atomically promote with rollback
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $Promoter=Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\cluster\PROMOTE-RONSAS-HUB.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $Promoter -Root "$env:USERPROFILE\Resonance\OpenNova" -HubSource $env:RONSAS_HUB_SOURCE -ValidateOnly
          if ($LASTEXITCODE) { throw 'Candidate validation failed.' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $Promoter -Root "$env:USERPROFILE\Resonance\OpenNova" -HubSource $env:RONSAS_HUB_SOURCE
          if ($LASTEXITCODE) { throw 'Hub promotion failed.' }

      - name: Restore public edge and verify Hub policy-critical routes
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $Control="$env:USERPROFILE\AppData\Local\Resonance\RONS-ControlCenter"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $Control 'RONS-Ensure-Public-Edge.ps1')
          if ($LASTEXITCODE) { throw 'Public edge restore failed.' }
          Start-Sleep -Seconds 4

          $hubChecks=@(
            @{Url='https://reson8.life/'; Contains='temporarily free'},
            @{Url='https://reson8.life/pricing'; Contains='free during the promotion'},
            @{Url='https://reson8.life/changelog'; Contains='Changelog'},
            @{Url='https://reson8.life/api/public/app-status/health'; Contains='"ok": true'}
          )
          foreach($c in $hubChecks){
            $resp=Invoke-WebRequest -UseBasicParsing -Uri $c.Url -TimeoutSec 15
            if($resp.StatusCode -ne 200){throw "$($c.Url) returned $($resp.StatusCode)"}
            if($c.Contains -and [string]$resp.Content -notlike ('*'+$c.Contains+'*')){throw "$($c.Url) missing expected marker: $($c.Contains)"}
            Write-Host "PASS HUB $($c.Url) HTTP $($resp.StatusCode)"
          }

      - name: Observe spoke availability without invalidating Hub promotion
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $spokes=@(
            'https://epublisher.reson8.life/',
            'https://creative.reson8.life/',
            'https://sync.reson8.life/',
            'https://youtube.reson8.life/'
          )
          $failures=@()
          foreach($url in $spokes){
            try {
              $resp=Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 15
              if($resp.StatusCode -ne 200){throw "HTTP $($resp.StatusCode)"}
              Write-Host "PASS SPOKE $url HTTP $($resp.StatusCode)"
            } catch {
              $msg="$url unavailable: $($_.Exception.Message)"
              Write-Warning $msg
              $failures += $msg
            }
          }
          if($failures.Count -gt 0){
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Spoke availability warnings"
            foreach($f in $failures){ Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- $f" }
          }

      - name: Record governed release receipt
        if: always()
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ReceiptRoot="$env:USERPROFILE\Resonance\OpenNova\runtime\release-receipts"
          New-Item -ItemType Directory -Force -Path $ReceiptRoot | Out-Null
          $payload=[ordered]@{
            schema='ronsas-windows-hub-release/v1'
            commit='${{ steps.request.outputs.commit }}'
            runId='${{ github.run_id }}'
            conclusion='${{ job.status }}'
            recordedAt=(Get-Date).ToUniversalTime().ToString('o')
          }
          $payload | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $ReceiptRoot ("github-hub-release-${{ github.run_id }}.json")) -Encoding UTF8

      - name: Remove isolated worktree
        if: always()
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          if($env:RONSAS_HUB_WORKTREE -and (Test-Path -LiteralPath $env:RONSAS_HUB_WORKTREE)){
            & git -C $env:RONSAS_HUB_SOURCE worktree remove --force $env:RONSAS_HUB_WORKTREE
          }
