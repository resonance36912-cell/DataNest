name: Repair Railway ePublisher fallback

on:
  push:
    branches: [main]
    paths:
      - "ops/release-requests/railway-epublisher-fallback.json"
      - ".github/workflows/repair-railway-epublisher.yml"

permissions:
  contents: read

concurrency:
  group: ronsas-railway-epublisher-fallback
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate governed request
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content -Raw -LiteralPath 'ops/release-requests/railway-epublisher-fallback.json' | ConvertFrom-Json
          if([string]$r.schema -ne 'ronsas-railway-epublisher-repair/v6'){throw 'Unexpected repair schema.'}
          if([string]$r.confirmation -ne 'REPAIR RAILWAY EPUB FALLBACK'){throw 'Explicit repair confirmation missing.'}
          if([string]$r.projectId -ne '70cc7bde-c5ba-4224-9c74-ddb873b27379'){throw 'Unexpected Railway project.'}
          if([string]$r.environmentId -ne '78627988-2f5f-42a8-a507-ee5e221bf10a'){throw 'Unexpected Railway environment.'}
          if([string]$r.serviceId -ne '37312153-7877-4830-85ae-5b48e6275319'){throw 'Unexpected Railway service.'}
          if([string]$r.image -ne 'ghcr.io/resonance36912-cell/rons-epublisher-sovereign-source@sha256:24bd12c56ba0f33b7d615f9860396e094df5c394d0b614d3320b13477ef22da1'){throw 'Unexpected immutable image.'}
          if([string]$r.targetStartCommand -ne 'npm exec -- vite preview --host 0.0.0.0 --port $PORT'){throw 'Unexpected target start command.'}
          if([long]$r.verification.workflowRunId -ne 35501093514){throw 'Unexpected verification workflow.'}
          if(-not [bool]$r.verification.anonymousPull -or -not [bool]$r.verification.runtimeSmoke){throw 'Image verification is incomplete.'}
          if(-not [bool]$r.recovery.stageStartCommandOnly -or -not [bool]$r.recovery.stageOnly){throw 'Runtime-command staging authorization is incomplete.'}
          if([bool]$r.constraints.changeSource -or [bool]$r.constraints.changeDomains -or [bool]$r.constraints.changeBilling -or [bool]$r.constraints.changeVariables -or [bool]$r.constraints.createService -or [bool]$r.constraints.cloudflareWorkerMigration -or [bool]$r.constraints.changeHealthcheck -or [bool]$r.constraints.changeReplicas -or [bool]$r.constraints.changeRuntime -or [bool]$r.constraints.changeBuildSettings){throw 'Repair request violates protected constraints.'}

      - name: Stage verified npm runtime command
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $Project='70cc7bde-c5ba-4224-9c74-ddb873b27379'
          $Environment='78627988-2f5f-42a8-a507-ee5e221bf10a'
          $Service='37312153-7877-4830-85ae-5b48e6275319'
          $StartCommand='npm exec -- vite preview --host 0.0.0.0 --port $PORT'

          $Railway=(Get-Command railway.cmd -ErrorAction SilentlyContinue).Source
          if(-not $Railway){throw 'railway.cmd is unavailable on the governed Ealiophin runner.'}
          Write-Host ('Railway CLI: ' + (& $Railway --version))

          $ErrorActionPreference='Continue'
          $out=& $Railway environment edit --project $Project --environment $Environment --service-config $Service deploy.startCommand $StartCommand --stage --message 'RONSAS verified ePublisher image runtime command' --json 2>&1
          $exit=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          $text=(($out | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine).Trim()
          if($exit -ne 0){throw ('Railway start-command staging failed: ' + $text)}
          if(-not [string]::IsNullOrWhiteSpace($text)){Write-Host $text}

          $jsonLine=($out | ForEach-Object { $_.ToString() } | Where-Object { $_.TrimStart().StartsWith('{') } | Select-Object -Last 1)
          if([string]::IsNullOrWhiteSpace($jsonLine)){throw 'Railway did not return a JSON staging result.'}
          $result=$jsonLine | ConvertFrom-Json
          if(-not [bool]$result.staged){throw ('Railway did not stage the verified runtime command: ' + $jsonLine)}
          Write-Host 'RONSAS RAILWAY EPUB VERIFIED START COMMAND: STAGED ONLY'
