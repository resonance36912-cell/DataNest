name: Repair Railway ePublisher fallback

on:
  push:
    branches: [main]
    paths:
      - "ops/release-requests/railway-epublisher-fallback.json"
      - ".github/workflows/repair-railway-epublisher.yml"

permissions:
  contents: read

concurrency:
  group: ronsas-railway-epublisher-fallback
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate governed request
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content -Raw -LiteralPath 'ops/release-requests/railway-epublisher-fallback.json' | ConvertFrom-Json
          if([string]$r.schema -ne 'ronsas-railway-epublisher-repair/v1'){throw 'Unexpected repair schema.'}
          if([string]$r.confirmation -ne 'REPAIR RAILWAY EPUB FALLBACK'){throw 'Explicit repair confirmation missing.'}
          if([string]$r.projectId -ne '70cc7bde-c5ba-4224-9c74-ddb873b27379'){throw 'Unexpected Railway project.'}
          if([string]$r.environmentId -ne '78627988-2f5f-42a8-a507-ee5e221bf10a'){throw 'Unexpected Railway environment.'}
          if([string]$r.serviceId -ne '37312153-7877-4830-85ae-5b48e6275319'){throw 'Unexpected Railway service.'}
          if([string]$r.repo -ne 'resonance36912-cell/rons-epublisher-sovereign-source'){throw 'Unexpected source repository.'}
          if([string]$r.branch -ne 'main'){throw 'Unexpected source branch.'}
          if([string]$r.staleCommit -ne '3db4856da7ddda7fd8dd18c2e7fe7b66c0334a51'){throw 'Unexpected stale commit.'}
          if([string]$r.targetCommit -ne '5827b0b89abc8e5f13aa29593075edddbf80a9ae'){throw 'Unexpected target commit.'}
          if([bool]$r.constraints.changeDomains -or [bool]$r.constraints.changeBilling -or [bool]$r.constraints.changeVariables -or [bool]$r.constraints.createService -or [bool]$r.constraints.cloudflareWorkerMigration){throw 'Repair request violates protected constraints.'}

      - name: Stage governed target source state
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $Project='70cc7bde-c5ba-4224-9c74-ddb873b27379'
          $Environment='78627988-2f5f-42a8-a507-ee5e221bf10a'
          $Service='37312153-7877-4830-85ae-5b48e6275319'
          $Branch='main'
          $Target='5827b0b89abc8e5f13aa29593075edddbf80a9ae'

          $Railway=(Get-Command railway.cmd -ErrorAction SilentlyContinue).Source
          if(-not $Railway){
            $Npm=(Get-Command npm.cmd -ErrorAction SilentlyContinue).Source
            if(-not $Npm){throw 'Railway CLI is missing and npm is unavailable for governed bootstrap.'}
            & $Npm install -g @railway/cli
            if($LASTEXITCODE -ne 0){throw 'Governed Railway CLI bootstrap failed.'}
            $Railway=(Get-Command railway.cmd -ErrorAction SilentlyContinue).Source
            if(-not $Railway){throw 'Railway CLI bootstrap completed but railway.cmd is unavailable.'}
          }

          Write-Host ('Railway CLI: ' + (& $Railway --version))

          $link=& $Railway link --workspace 'd60eede3-77a8-4dc9-9e7f-19b8f9e938e6' --project $Project --environment $Environment --service $Service --json 2>&1
          if($LASTEXITCODE -ne 0){throw ('Railway link failed: ' + (($link | Out-String).Trim()))}
          Write-Host (($link | Out-String).Trim())

          $branchStage=& $Railway environment edit --environment $Environment --service-config $Service source.branch $Branch --stage --message 'RONSAS governed ePublisher fallback source repair' --json 2>&1
          if($LASTEXITCODE -ne 0){throw ('Railway branch staging failed: ' + (($branchStage | Out-String).Trim()))}
          Write-Host (($branchStage | Out-String).Trim())

          $commitStage=& $Railway environment edit --environment $Environment --service-config $Service source.commitSha $Target --stage --message 'RONSAS governed ePublisher fallback target commit' --json 2>&1
          if($LASTEXITCODE -ne 0){throw ('Railway commit staging failed: ' + (($commitStage | Out-String).Trim()))}
          Write-Host (($commitStage | Out-String).Trim())

          Write-Host ('RONSAS RAILWAY EPUB TARGET STAGED: ' + $Target)
