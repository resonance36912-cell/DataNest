name: Stop free-promotion recurring billing

on:
  push:
    branches: [main]
    paths:
      - "ops/release-requests/free-promotion-billing-stop.json"
      - "ops/ealiophin/billing/stop-payfast-recurring.mjs"
      - ".github/workflows/stop-free-promotion-billing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ronsas-free-promotion-billing-stop
  cancel-in-progress: false

jobs:
  stop:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate governed billing-stop request
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $path='ops\release-requests\free-promotion-billing-stop.json'
          $r=Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if([string]$r.schema -ne 'ronsas-free-promotion-billing-stop/v1'){throw 'Unexpected billing-stop schema.'}
          if([string]$r.confirmation -ne 'STOP RONSAS RECURRING BILLING'){throw 'Explicit billing-stop confirmation missing.'}
          if([string]$r.effectiveOn -ne '2026-09-20'){throw 'Unexpected promotion effective date.'}
          if([string]$r.provider -ne 'payfast'){throw 'Unexpected provider.'}
          if(-not [bool]$r.policy.freePromotion){throw 'Free-promotion flag missing.'}
          if([bool]$r.policy.newCheckoutLaunches){throw 'New checkout launches must remain disabled.'}
          if([bool]$r.policy.existingRecurringCharges){throw 'Existing recurring charges must be disabled.'}
          if(-not [bool]$r.policy.cancelProviderTokens){throw 'Provider token cancellation is required.'}
          if([bool]$r.policy.refundPriorPayments){throw 'Refunds are outside this governed operation.'}

      - name: Verify production Hub credential names
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $envFile='C:\Resonance\Sources\ronsas-hub-canonical\.env.local'
          if(-not (Test-Path -LiteralPath $envFile -PathType Leaf)){throw "Hub runtime env missing: $envFile"}
          $names=@{}
          foreach($line in Get-Content -LiteralPath $envFile){
            if($line -match '^\s*([A-Za-z_][A-Za-z0-9_]*)\s*='){$names[$Matches[1]]=$true}
          }
          foreach($required in @('SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','PAYFAST_MERCHANT_ID','PAYFAST_PASSPHRASE')){
            if(-not $names.ContainsKey($required)){throw "Required Hub credential name missing: $required"}
          }
          Write-Host 'Required Hub credential names are present; values were not printed.'

      - name: Cancel provider renewals and reconcile subscription state
        id: stop
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $envFile='C:\Resonance\Sources\ronsas-hub-canonical\.env.local'
          $node=(Get-Command node.exe -ErrorAction Stop).Source
          & $node "--env-file=$envFile" "ops\ealiophin\billing\stop-payfast-recurring.mjs" --request "ops\release-requests\free-promotion-billing-stop.json" --execute
          if($LASTEXITCODE -ne 0){throw "Billing-stop worker exited with code $LASTEXITCODE"}

      - name: Upload redacted billing-stop receipt
        if: always() && steps.stop.outputs.receipt_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: free-promotion-billing-stop-${{ github.run_id }}
          path: ${{ steps.stop.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 30
