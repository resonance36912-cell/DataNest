name: Stop free-promotion recurring billing

on:
  push:
    branches: [main]
    paths:
      - "ops/release-requests/free-promotion-billing-stop.json"
      - "ops/ealiophin/billing/stop-payfast-recurring.mjs"
      - ".github/workflows/stop-free-promotion-billing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ronsas-free-promotion-billing-stop
  cancel-in-progress: false

jobs:
  stop:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate governed billing-stop request
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $path='ops\release-requests\free-promotion-billing-stop.json'
          $r=Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if([string]$r.schema -ne 'ronsas-free-promotion-billing-stop/v1'){throw 'Unexpected billing-stop schema.'}
          if([string]$r.confirmation -ne 'STOP RONSAS RECURRING BILLING'){throw 'Explicit billing-stop confirmation missing.'}
          if([string]$r.effectiveOn -ne '2026-09-20'){throw 'Unexpected promotion effective date.'}
          if([string]$r.provider -ne 'payfast'){throw 'Unexpected provider.'}
          if([string]$r.authority.backend -ne 'sovereign'){throw 'Production billing authority must be sovereign.'}
          if([string]$r.authority.gateway -ne 'http://127.0.0.1:58600'){throw 'Unexpected sovereign gateway.'}
          if([string]$r.authority.billingAdminProcedure -ne 'read_billing_admin'){throw 'Unexpected billing admin procedure.'}
          if(-not [bool]$r.policy.freePromotion){throw 'Free-promotion flag missing.'}
          if([bool]$r.policy.newCheckoutLaunches){throw 'New checkout launches must remain disabled.'}
          if([bool]$r.policy.existingRecurringCharges){throw 'Existing recurring charges must be disabled.'}
          if(-not [bool]$r.policy.cancelProviderTokens){throw 'Provider token cancellation is required when candidates exist.'}
          if([bool]$r.policy.refundPriorPayments){throw 'Refunds are outside this governed operation.'}

      - name: Inspect authoritative sovereign subscription state
        id: authority
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $request=Get-Content -Raw -LiteralPath 'ops\release-requests\free-promotion-billing-stop.json' | ConvertFrom-Json
          $gateway=[string]$request.authority.gateway
          $procedure=[string]$request.authority.billingAdminProcedure
          $keyPath=Join-Path $env:USERPROFILE 'Resonance\OpenNova\runtime\secrets\gateway-procedure-key'
          if(-not (Test-Path -LiteralPath $keyPath -PathType Leaf)){throw 'Gateway procedure key file is missing.'}
          $key=(Get-Content -Raw -LiteralPath $keyPath).Trim()
          if($key.Length -lt 32){throw 'Gateway procedure key is invalid.'}

          $body=@{name=$procedure;args=@{}} | ConvertTo-Json -Depth 4 -Compress
          try{
            $resp=Invoke-WebRequest -UseBasicParsing -Uri ($gateway + '/v1/db/procedure') -Method Post -ContentType 'application/json' -Headers @{'X-RONS-Procedure-Key'=$key} -Body $body -TimeoutSec 15
          }catch{
            $code='ERR'
            if($_.Exception.Response){try{$code=[int]$_.Exception.Response.StatusCode}catch{}}
            throw ('Sovereign billing admin procedure failed HTTP ' + $code)
          }
          if($resp.StatusCode -ne 200){throw ('Sovereign billing admin procedure returned HTTP ' + $resp.StatusCode)}

          $payload=$resp.Content | ConvertFrom-Json
          $subscriptions=@($payload.subscriptions)
          $nonCancelled=@($subscriptions | Where-Object {[string]$_.status -ne 'cancelled'})
          $active=@($subscriptions | Where-Object {[string]$_.status -eq 'active'})
          $total=$subscriptions.Count
          $candidates=$nonCancelled.Count

          Write-Host ('authoritative_subscription_rows=' + $total)
          Write-Host ('active_subscription_rows=' + $active.Count)
          Write-Host ('non_cancelled_subscription_rows=' + $candidates)
          "subscription_rows=$total" >> $env:GITHUB_OUTPUT
          "candidate_rows=$candidates" >> $env:GITHUB_OUTPUT

          if($candidates -gt 0){
            throw ("Sovereign billing authority contains " + $candidates + " non-cancelled subscription row(s). Refusing the legacy Supabase cancellation worker; a reviewed sovereign/provider cancellation path is required.")
          }

          $receiptRoot=Join-Path $env:USERPROFILE 'Resonance\OpenNova\runtime\release-receipts'
          New-Item -ItemType Directory -Force -Path $receiptRoot | Out-Null
          $runId=if($env:GITHUB_RUN_ID){$env:GITHUB_RUN_ID}else{[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()}
          $receiptPath=Join-Path $receiptRoot ("free-promotion-billing-stop-" + $runId + ".json")
          [ordered]@{
            schema='ronsas-free-promotion-billing-stop-receipt/v2'
            authority='sovereign'
            mode='no-op'
            effectiveOn=[string]$request.effectiveOn
            subscriptionRows=$total
            candidateRows=$candidates
            providerCancelled=0
            rowsCancelled=0
            refundsInitiated=0
            reason='No non-cancelled subscription rows exist in the authoritative sovereign billing store.'
            completedAt=(Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath $receiptPath -Encoding UTF8
          "receipt_path=$receiptPath" >> $env:GITHUB_OUTPUT
          Write-Host 'No authoritative recurring-billing candidates exist; provider cancellation is not required.'

      - name: Upload redacted sovereign billing-stop receipt
        if: always() && steps.authority.outputs.receipt_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: free-promotion-billing-stop-${{ github.run_id }}
          path: ${{ steps.authority.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 30
