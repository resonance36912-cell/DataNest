name: Verify checkout links

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: verify-checkout-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pricing pages → /checkout SKU links
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin]
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests for dynamic-CTA tracing + SKU validation helpers
        run: bun run test:checkout-links

      - name: Verify all pricing pages use relative /checkout URLs with valid SKUs
        run: bun run verify:checkout-links

      - name: Unit tests for pricing pack ↔ PACK_CATALOG cross-check
        run: bun run test:pricing-packs

      - name: Verify /pricing renders exactly the packs in PACK_CATALOG
        run: bun run verify:pricing-packs


