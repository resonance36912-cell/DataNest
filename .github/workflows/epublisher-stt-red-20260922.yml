name: ePublisher STT runtime sync focused

on:
  push:
    branches: [ronsas/epublisher-stt-runtime-sync-20260922]
    paths:
      - "scripts/lib/epublisher-stt-runtime-sync.test.ts"
      - "ops/ealiophin/cluster/START-RONSAS-ECOSYSTEM.ps1"
      - ".github/workflows/epublisher-stt-red-20260922.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: epublisher-stt-runtime-sync-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run focused regression assertion
        id: test
        continue-on-error: true
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $path = 'ops\ealiophin\cluster\START-RONSAS-ECOSYSTEM.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          $needles = @(
            "`$sttSource = Join-Path `$opsRuntime 'syncvision-local-stt.py'",
            "`$sttTarget = Join-Path `$Runtime 'syncvision-local-stt.py'",
            "Copy-Item -LiteralPath `$sttSource -Destination `$sttTarget -Force"
          )
          $missing = @($needles | Where-Object { -not $text.Contains($_) })
          $lines = @(
            'Focused runtime-sync regression',
            ('missing_count=' + $missing.Count),
            ($missing | ForEach-Object { 'MISSING: ' + $_ })
          )
          $lines | Set-Content -LiteralPath $env:RUNNER_TEMP\epublisher-stt-red.txt -Encoding UTF8
          "exit_code=" + $(if ($missing.Count) { 1 } else { 0 }) | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($missing.Count) { exit 1 }
      - name: Publish RED receipt
        if: always()
        uses: actions/github-script@v8
        env:
          EXIT_CODE: ${{ steps.test.outputs.exit_code }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const p = process.env.RUNNER_TEMP + "\\epublisher-stt-red.txt";
            let out = fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "<missing test output>";
            const body = ["EPUBLISHER_STT_FOCUSED_CHECK", "", "SHA: " + context.sha, "exit_code=" + (process.env.EXIT_CODE || "unknown"), "", "```", out, "```"].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});
      - name: Capture supervisor control state
        if: steps.test.outcome == 'success'
        id: supervisor
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference = 'Stop'
          $control = Join-Path $env:LOCALAPPDATA 'Resonance\RONS-ControlCenter'
          $configPath = Join-Path $control 'rons-control.json'
          $state = [ordered]@{
            config_exists = (Test-Path -LiteralPath $configPath -PathType Leaf)
            ensure_suite = $null
            ensure_public_edge = $null
            services = @()
            port_7869_listening = $false
          }
          if ($state.config_exists) {
            $cfg = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
            if ($cfg.autonomy) {
              $state['ensure_suite'] = [bool]$cfg.autonomy.ensureSuite
              $state['ensure_public_edge'] = [bool]$cfg.autonomy.ensurePublicEdge
            }
            $state['services'] = @($cfg.services | ForEach-Object {
              [ordered]@{
                key = [string]$_.key
                name = [string]$_.name
                port = [int]$_.port
                required = [bool]$_.required
              }
            })
          }
          $netstat = (& netstat.exe -ano -p tcp | Out-String)
          $state['port_7869_listening'] = [bool]($netstat -match '(?m)^\s*TCP\s+\S+:7869\s+\S+\s+LISTENING\s+\d+\s*$')
          $json = $state | ConvertTo-Json -Depth 8 -Compress
          "supervisor_json=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish supervisor control state
        if: always() && steps.test.outcome == 'success'
        uses: actions/github-script@v8
        env:
          SUPERVISOR_JSON: ${{ steps.supervisor.outputs.supervisor_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = ["EPUBLISHER_STT_SUPERVISOR_STATE", "", "SHA: " + context.sha, "", process.env.SUPERVISOR_JSON || "{}"].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});

      - name: Reconcile live STT supervision
        if: steps.test.outcome == 'success'
        id: repair
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:USERPROFILE 'Resonance\OpenNova'
          $runtime = Join-Path $root 'runtime'
          $control = Join-Path $env:LOCALAPPDATA 'Resonance\RONS-ControlCenter'
          $configPath = Join-Path $control 'rons-control.json'
          $liveSupervisor = Join-Path $control 'RONS-Supervisor.ps1'
          $sourceSupervisor = Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\control-center\RONS-Supervisor.ps1'
          $sourceTaskRunner = Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\control-center\RONS-ePublisher-STT.ps1'
          $sourceTaskInstaller = Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\control-center\REGISTER-RONS-EPUBLISHER-STT-TASK.ps1'
          $liveTaskRunner = Join-Path $control 'RONS-ePublisher-STT.ps1'
          $liveTaskInstaller = Join-Path $control 'REGISTER-RONS-EPUBLISHER-STT-TASK.ps1'
          $runtimeSource = Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\runtime\syncvision-local-stt.py'
          $runtimeTarget = Join-Path $runtime 'syncvision-local-stt.py'

          foreach ($requiredPath in @($configPath, $sourceSupervisor, $sourceTaskRunner, $sourceTaskInstaller, $runtimeSource)) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) { throw "Required governed path missing: $requiredPath" }
          }

          $cfg = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $entry = @($cfg.services | Where-Object {
            ([string]$_.key -eq 'epublisher-stt') -or ([int]$_.port -eq 7869)
          }) | Select-Object -First 1
          $configChanged = $false
          if ($entry) {
            if (-not [bool]$entry.required) {
              $entry.required = $true
              $configChanged = $true
            }
          } else {
            $cfg.services += [pscustomobject]@{
              key = 'epublisher-stt'
              name = 'ePublisher Speech-to-Text'
              port = 7869
              required = $true
            }
            $configChanged = $true
          }
          if ($configChanged) {
            $json = $cfg | ConvertTo-Json -Depth 20
            [IO.File]::WriteAllText($configPath, $json, (New-Object Text.UTF8Encoding($false)))
          }

          function Sync-GovernedFile([string]$Source,[string]$Target) {
            $changed = $true
            if (Test-Path -LiteralPath $Target -PathType Leaf) {
              $changed = (
                (Get-FileHash -LiteralPath $Source -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $Target -Algorithm SHA256).Hash
              )
            }
            if ($changed) { Copy-Item -LiteralPath $Source -Destination $Target -Force }
            return $changed
          }

          $supervisorChanged = Sync-GovernedFile $sourceSupervisor $liveSupervisor
          $taskRunnerChanged = Sync-GovernedFile $sourceTaskRunner $liveTaskRunner
          $taskInstallerChanged = Sync-GovernedFile $sourceTaskInstaller $liveTaskInstaller
          $runtimeChanged = Sync-GovernedFile $runtimeSource $runtimeTarget

          $taskOutput = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $liveTaskInstaller 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw ("ePublisher STT scheduled task install failed: " + (($taskOutput | Select-Object -Last 12) -join ' | '))
          }

          try {
            $health = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:7869/health' -TimeoutSec 5
            $healthy = ([int]$health.StatusCode -eq 200)
          } catch {
            $healthy = $false
          }
          if (-not $healthy) { throw "ePublisher STT scheduled task is not healthy on port 7869" }

          $result = [ordered]@{
            config_changed = $configChanged
            supervisor_changed = $supervisorChanged
            task_runner_changed = $taskRunnerChanged
            task_installer_changed = $taskInstallerChanged
            runtime_changed = $runtimeChanged
            scheduled_task_registered = $true
            port_7869_healthy = $healthy
          }
          $json = $result | ConvertTo-Json -Compress
          "repair_json=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish governed recovery result
        if: always() && steps.test.outcome == 'success'
        uses: actions/github-script@v8
        env:
          REPAIR_JSON: ${{ steps.repair.outputs.repair_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = ["EPUBLISHER_STT_GOVERNED_RECOVERY", "", "SHA: " + context.sha, "", process.env.REPAIR_JSON || "{}"].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});

      - name: Capture bounded STT acceptance result
        if: steps.test.outcome == 'success'
        id: source
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $runtime = Join-Path $env:USERPROFILE 'Resonance\OpenNova\runtime'
          $python = Join-Path $runtime 'python-envs\epublisher-stt\Scripts\python.exe'
          $probe = Join-Path $env:RUNNER_TEMP 'epublisher-source-probe.py'
          @'
          import json, urllib.request, urllib.error, time
          out={}
          def get_json(url, timeout=10):
              try:
                  with urllib.request.urlopen(url, timeout=timeout) as resp:
                      raw=resp.read().decode('utf-8','replace')
                      return {'status':resp.status,'ok':True,'body':json.loads(raw)}
              except urllib.error.HTTPError as exc:
                  raw=exc.read().decode('utf-8','replace')
                  return {'status':exc.code,'ok':False,'detail':raw[:1200]}
              except Exception as exc:
                  return {'status':None,'ok':False,'detail':str(exc)[:1200]}
          def post_url(url, video_url, timeout=180):
              payload=json.dumps({'url':video_url,'mode':'fast'}).encode('utf-8')
              req=urllib.request.Request(url,data=payload,method='POST',headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as resp:
                      raw=resp.read().decode('utf-8','replace')
                      obj=json.loads(raw)
                      return {'status':resp.status,'ok':True,'text_length':len(str(obj.get('text') or '')),'provider':(obj.get('quality') or {}).get('provider'),'video_id':obj.get('video_id')}
              except urllib.error.HTTPError as exc:
                  raw=exc.read().decode('utf-8','replace')
                  return {'status':exc.code,'ok':False,'detail':raw[:1600]}
              except Exception as exc:
                  return {'status':None,'ok':False,'detail':str(exc)[:1600]}
          out['direct_health_before']=get_json('http://127.0.0.1:7869/health')
          out['public_proxy_health']=get_json('https://epublisher.reson8.life/open-nova-stt/health', 20)
          # Known public source that has previously exercised the full yt-dlp -> local STT path.
          out['public_source']=post_url('http://127.0.0.1:7869/transcribe-url','https://www.youtube.com/watch?v=1CGlQSzPXRM',180)
          time.sleep(3)
          out['direct_health_after']=get_json('http://127.0.0.1:7869/health')
          # The screenshot's Part 1 URL is age-restricted. Probe it briefly and
          # preserve source-unavailable as a content-access result, not an infrastructure 502.
          out['restricted_source']=post_url('http://127.0.0.1:7869/transcribe-url','https://www.youtube.com/watch?v=CxKEyVgYBpk',30)
          print(json.dumps(out,separators=(',',':')))
          '@ | Set-Content -LiteralPath $probe -Encoding UTF8
          $json = & $python $probe
          "source_json=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Publish bounded STT acceptance result
        if: always() && steps.test.outcome == 'success'
        uses: actions/github-script@v8
        env:
          SOURCE_JSON: ${{ steps.source.outputs.source_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = ["EPUBLISHER_STT_SOURCE_DIAGNOSTIC", "", "SHA: " + context.sha, "", process.env.SOURCE_JSON || "{}"].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});

      - name: Capture persistent STT task state
        if: always() && steps.test.outcome == 'success'
        id: persistent
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $runtime = Join-Path $env:USERPROFILE 'Resonance\OpenNova\runtime'
          $log = Join-Path $runtime 'logs\rons-cluster\epublisher-stt-task.log'
          $state = [ordered]@{
            port_7869_listening = $false
            task_query = ''
            log_tail = ''
          }
          $netstat = (& netstat.exe -ano -p tcp | Out-String)
          $state['port_7869_listening'] = [bool]($netstat -match '(?m)^\s*TCP\s+\S+:7869\s+\S+\s+LISTENING\s+\d+\s*        if: steps.test.outcome == 'failure'
        run: exit 1
)
          $taskText = (& schtasks.exe /Query /TN "RONS ePublisher STT" /FO LIST /V 2>&1 | Out-String)
          if ($taskText.Length -gt 3000) { $taskText = $taskText.Substring($taskText.Length - 3000) }
          $state['task_query'] = $taskText
          if (Test-Path -LiteralPath $log -PathType Leaf) {
            $tail = (Get-Content -LiteralPath $log -Tail 80 -ErrorAction SilentlyContinue | Out-String)
            if ($tail.Length -gt 6000) { $tail = $tail.Substring($tail.Length - 6000) }
            $tail = $tail -replace '(?im)^.*cookie.*        if: steps.test.outcome == 'failure'
        run: exit 1
, '[cookie-related log line redacted]'
            $state['log_tail'] = $tail
          }
          $json = $state | ConvertTo-Json -Depth 6 -Compress
          "persistent_json=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish persistent STT task state
        if: always() && steps.test.outcome == 'success'
        uses: actions/github-script@v8
        env:
          PERSISTENT_JSON: ${{ steps.persistent.outputs.persistent_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = ["EPUBLISHER_STT_PERSISTENT_STATE", "", "SHA: " + context.sha, "", process.env.PERSISTENT_JSON || "{}"].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});

      - name: Preserve focused check state
        if: steps.test.outcome == 'failure'
        run: exit 1
