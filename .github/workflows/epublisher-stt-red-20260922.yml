name: ePublisher STT runtime sync RED

on:
  push:
    branches: [ronsas/epublisher-stt-runtime-sync-20260922]
    paths:
      - "scripts/lib/epublisher-stt-runtime-sync.test.ts"
      - ".github/workflows/epublisher-stt-red-20260922.yml"

permissions:
  contents: read
  issues: write

jobs:
  red:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
          no-cache: true
      - name: Run focused regression test
        id: test
        continue-on-error: true
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $out = & bun test scripts/lib/epublisher-stt-runtime-sync.test.ts 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out | Set-Content -LiteralPath $env:RUNNER_TEMP\epublisher-stt-red.txt -Encoding UTF8
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($code -ne 0) { exit $code }
      - name: Publish RED receipt
        if: always()
        uses: actions/github-script@v8
        env:
          EXIT_CODE: ${{ steps.test.outputs.exit_code }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const p = process.env.RUNNER_TEMP + "\\epublisher-stt-red.txt";
            let out = fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "<missing test output>";
            if (out.length > 7000) out = out.slice(-7000);
            const body = ["EPUBLISHER_STT_TDD_RED", "", "SHA: " + context.sha, "exit_code=" + (process.env.EXIT_CODE || "unknown"), "", "```", out, "```"].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});
