# Exact-head acceptance workflow
name: ePublisher STT runtime sync focused

on:
  push:
    branches: [ronsas/epublisher-stt-runtime-sync-20260922]
    paths:
      - "scripts/lib/epublisher-stt-runtime-sync.test.ts"
      - "ops/ealiophin/cluster/START-RONSAS-ECOSYSTEM.ps1"
      - "ops/ealiophin/control-center/RONS-Supervisor.ps1"
      - "ops/ealiophin/control-center/RONS-ePublisher-STT.ps1"
      - "ops/ealiophin/control-center/REGISTER-RONS-EPUBLISHER-STT-TASK.ps1"
      - ".github/workflows/epublisher-stt-red-20260922.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: epublisher-stt-runtime-sync-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Verify runtime-sync implementation
        id: regression
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'ops\ealiophin\cluster\START-RONSAS-ECOSYSTEM.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          $needles = @(
            "`$sttSource = Join-Path `$opsRuntime 'syncvision-local-stt.py'",
            "`$sttTarget = Join-Path `$Runtime 'syncvision-local-stt.py'",
            "Copy-Item -LiteralPath `$sttSource -Destination `$sttTarget -Force",
            "Assert-KnownPort 'epublisher-stt' 7869 'syncvision-local-stt.py'",
            "Start-PythonService 'epublisher-stt' 7869"
          )
          $missing = @($needles | Where-Object { -not $text.Contains($_) })
          if ($missing.Count) {
            throw ("Missing governed STT runtime-sync assertions: " + ($missing -join '; '))
          }
          'regression_json={"ok":true,"missing_count":0}' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Reconcile persistent ePublisher STT supervision
        id: repair
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:USERPROFILE 'Resonance\OpenNova'
          $runtime = Join-Path $root 'runtime'
          $control = Join-Path $env:LOCALAPPDATA 'Resonance\RONS-ControlCenter'
          $configPath = Join-Path $control 'rons-control.json'
          $liveSupervisor = Join-Path $control 'RONS-Supervisor.ps1'
          $liveTaskRunner = Join-Path $control 'RONS-ePublisher-STT.ps1'
          $liveTaskInstaller = Join-Path $control 'REGISTER-RONS-EPUBLISHER-STT-TASK.ps1'
          $sourceSupervisor = Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\control-center\RONS-Supervisor.ps1'
          $sourceTaskRunner = Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\control-center\RONS-ePublisher-STT.ps1'
          $sourceTaskInstaller = Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\control-center\REGISTER-RONS-EPUBLISHER-STT-TASK.ps1'
          $runtimeSource = Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\runtime\syncvision-local-stt.py'
          $runtimeTarget = Join-Path $runtime 'syncvision-local-stt.py'

          foreach ($requiredPath in @($configPath, $sourceSupervisor, $sourceTaskRunner, $sourceTaskInstaller, $runtimeSource)) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) { throw "Required governed path missing: $requiredPath" }
          }

          function Sync-GovernedFile([string]$Source, [string]$Target) {
            $changed = $true
            if (Test-Path -LiteralPath $Target -PathType Leaf) {
              $changed = ((Get-FileHash -LiteralPath $Source -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $Target -Algorithm SHA256).Hash)
            }
            if ($changed) { Copy-Item -LiteralPath $Source -Destination $Target -Force }
            return $changed
          }

          $cfg = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $entry = @($cfg.services | Where-Object { ([string]$_.key -eq 'epublisher-stt') -or ([int]$_.port -eq 7869) }) | Select-Object -First 1
          $configChanged = $false
          if ($entry) {
            if (-not [bool]$entry.required) { $entry.required = $true; $configChanged = $true }
          } else {
            $cfg.services += [pscustomobject]@{ key='epublisher-stt'; name='ePublisher Speech-to-Text'; port=7869; required=$true }
            $configChanged = $true
          }
          if ($configChanged) {
            $cfgJson = $cfg | ConvertTo-Json -Depth 20
            [IO.File]::WriteAllText($configPath, $cfgJson, (New-Object Text.UTF8Encoding($false)))
          }

          $supervisorChanged = Sync-GovernedFile $sourceSupervisor $liveSupervisor
          $taskRunnerChanged = Sync-GovernedFile $sourceTaskRunner $liveTaskRunner
          $taskInstallerChanged = Sync-GovernedFile $sourceTaskInstaller $liveTaskInstaller
          $runtimeChanged = Sync-GovernedFile $runtimeSource $runtimeTarget

          $taskOutput = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $liveTaskInstaller 2>&1
          if ($LASTEXITCODE -ne 0) { throw ("ePublisher STT scheduled task install failed: " + (($taskOutput | Select-Object -Last 12) -join ' | ')) }

          $deadline = (Get-Date).AddSeconds(90)
          $healthy = $false
          do {
            try {
              $health = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:7869/health' -TimeoutSec 5
              $healthy = ([int]$health.StatusCode -eq 200)
            } catch { $healthy = $false }
            if (-not $healthy) { Start-Sleep -Seconds 2 }
          } while (-not $healthy -and (Get-Date) -lt $deadline)
          if (-not $healthy) { throw 'Persistent ePublisher STT task is not healthy on port 7869' }

          $result = [ordered]@{ config_changed=$configChanged; supervisor_changed=$supervisorChanged; task_runner_changed=$taskRunnerChanged; task_installer_changed=$taskInstallerChanged; runtime_changed=$runtimeChanged; scheduled_task_registered=$true; port_7869_healthy=$true }
          $json = $result | ConvertTo-Json -Compress
          "repair_json=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run bounded STT acceptance probe
        id: acceptance
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-HttpResult([string]$Url, [int]$TimeoutSec = 10) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $Url -TimeoutSec $TimeoutSec
              return [ordered]@{ status=[int]$response.StatusCode; ok=([int]$response.StatusCode -eq 200) }
            } catch {
              $status = $null
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) { $status = [int]$_.Exception.Response.StatusCode }
              return [ordered]@{ status=$status; ok=$false; detail=$_.Exception.Message }
            }
          }
          function Post-SttUrl([string]$VideoUrl, [int]$TimeoutSec) {
            $body = @{ url=$VideoUrl; mode='fast' } | ConvertTo-Json -Compress
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:7869/transcribe-url' -Method Post -ContentType 'application/json' -Body $body -TimeoutSec $TimeoutSec
              $payload = $response.Content | ConvertFrom-Json
              return [ordered]@{ status=[int]$response.StatusCode; ok=([int]$response.StatusCode -eq 200 -and [bool]([string]$payload.text)); text_length=([string]$payload.text).Length; provider=[string]$payload.quality.provider; video_id=[string]$payload.video_id }
            } catch {
              $status = $null
              $detail = $_.Exception.Message
              if ($_.Exception.Response) {
                if ($_.Exception.Response.StatusCode) { $status = [int]$_.Exception.Response.StatusCode }
                try {
                  $reader = New-Object IO.StreamReader($_.Exception.Response.GetResponseStream())
                  $detail = $reader.ReadToEnd()
                  $reader.Dispose()
                } catch { }
              }
              return [ordered]@{ status=$status; ok=$false; detail=$detail }
            }
          }

          $result = [ordered]@{}
          $result.direct_health_before = Get-HttpResult 'http://127.0.0.1:7869/health' 10
          $result.public_proxy_health = Get-HttpResult 'https://epublisher.reson8.life/open-nova-stt/health' 20
          $result.public_source = Post-SttUrl 'https://www.youtube.com/watch?v=1CGlQSzPXRM' 180
          Start-Sleep -Seconds 3
          $result.direct_health_after = Get-HttpResult 'http://127.0.0.1:7869/health' 10
          $result.restricted_source = Post-SttUrl 'https://www.youtube.com/watch?v=CxKEyVgYBpk' 30
          $acceptanceOk = ($result.direct_health_before.ok -and $result.public_proxy_health.ok -and $result.public_source.ok -and $result.direct_health_after.ok -and ($result.restricted_source.status -ne 502) -and ($null -ne $result.restricted_source.status))
          $result.acceptance_ok = [bool]$acceptanceOk
          $json = $result | ConvertTo-Json -Depth 8 -Compress
          "acceptance_json=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $acceptanceOk) { throw "ePublisher STT bounded acceptance failed: $json" }

      - name: Capture persistent task state
        id: persistent
        if: always()
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $runtime = Join-Path $env:USERPROFILE 'Resonance\OpenNova\runtime'
          $log = Join-Path $runtime 'logs\rons-cluster\epublisher-stt-task.log'
          $netstat = (& netstat.exe -ano -p tcp | Out-String)
          $listening = [bool]($netstat -match '(?m)^\s*TCP\s+\S+:7869\s+\S+\s+LISTENING\s+\d+\s*$')
          $taskText = (& schtasks.exe /Query /TN "RONS ePublisher STT" /FO LIST /V 2>&1 | Out-String)
          if ($taskText.Length -gt 2500) { $taskText = $taskText.Substring($taskText.Length - 2500) }
          $logTail = ''
          if (Test-Path -LiteralPath $log -PathType Leaf) {
            $logTail = (Get-Content -LiteralPath $log -Tail 60 -ErrorAction SilentlyContinue | Out-String)
            $logTail = $logTail -replace '(?im)^.*cookie.*$', '[cookie-related log line redacted]'
            if ($logTail.Length -gt 4000) { $logTail = $logTail.Substring($logTail.Length - 4000) }
          }
          $state = [ordered]@{ port_7869_listening=$listening; task_query=$taskText; log_tail=$logTail }
          $json = $state | ConvertTo-Json -Depth 6 -Compress
          "persistent_json=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish validation receipt
        if: always()
        uses: actions/github-script@v8
        env:
          REGRESSION_JSON: ${{ steps.regression.outputs.regression_json }}
          REPAIR_JSON: ${{ steps.repair.outputs.repair_json }}
          ACCEPTANCE_JSON: ${{ steps.acceptance.outputs.acceptance_json }}
          PERSISTENT_JSON: ${{ steps.persistent.outputs.persistent_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const payload = {
              regression: JSON.parse(process.env.REGRESSION_JSON || "{}"),
              repair: JSON.parse(process.env.REPAIR_JSON || "{}"),
              acceptance: JSON.parse(process.env.ACCEPTANCE_JSON || "{}"),
              persistent: JSON.parse(process.env.PERSISTENT_JSON || "{}"),
            };
            const body = ["EPUBLISHER_STT_ACCEPTANCE", "", "SHA: " + context.sha, "", JSON.stringify(payload)].join("\n");
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 273, body});
