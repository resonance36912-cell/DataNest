name: Probe Ealiophin Windows runner minimal labels 2026-09-22

on:
  push:
    branches:
      - ronsas/switch-epublisher-root-to-railway-fallback-20260922
    paths:
      - ".github/workflows/probe-ealiophin-windows-minimal-20260922.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Prove the minimal-label Windows lane is Ealiophin
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "runner_name=$env:RUNNER_NAME"
          Write-Host "runner_os=$env:RUNNER_OS"
          Write-Host "runner_arch=$env:RUNNER_ARCH"
          Write-Host "computer_name=$env:COMPUTERNAME"
          if([string]$env:RUNNER_NAME -ne 'Ealiophin-RONSAS-Windows-1'){
            throw "Unexpected Windows runner: $env:RUNNER_NAME"
          }
          if([string]$env:COMPUTERNAME -notmatch '(?i)^EALIOPHIN$'){
            throw "Unexpected Windows host: $env:COMPUTERNAME"
          }
          Write-Host 'MINIMAL LABEL WINDOWS LANE: PASS'
