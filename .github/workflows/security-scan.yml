name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily at 03:17 UTC — catches newly-disclosed CVEs in pinned deps.
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  # SARIF artifact retention in days. Override by setting repo/org variable
  # SARIF_RETENTION_DAYS (GitHub caps user-set retention at 90 days).
  # Default: 14 days — long enough to triage a work week + weekend, short
  # enough to keep artifact storage bounded.
  SARIF_RETENTION_DAYS: ${{ vars.SARIF_RETENTION_DAYS || '14' }}
  # Number of top rule IDs to include in job-summary tables AND PR-annotation
  # emissions for Semgrep. Override with the repo/org variable
  # SARIF_SUMMARY_TOP_N. Default: 10 — small enough to skim in a PR review,
  # large enough to cover the meaningful long tail on most runs.
  SARIF_SUMMARY_TOP_N: ${{ vars.SARIF_SUMMARY_TOP_N || '10' }}

permissions:
  contents: read
  # Scan jobs need PR metadata read access; the pr-comment job overrides this to write.
  pull-requests: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Project security invariants
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run verify-security-invariants
        run: bun run scripts/verify-security-invariants.ts

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license required for public repos. For private repos add
          # GITLEAKS_LICENSE in repo secrets and uncomment:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Upload gitleaks SARIF artifact
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-sarif-${{ github.run_id }}-${{ github.sha }}
          path: results.sarif
          if-no-files-found: warn
          retention-days: ${{ env.SARIF_RETENTION_DAYS }}

  dependency-audit:
    name: Dependency audit (npm advisories)
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Verify pinned dependency versions
        # Fails if package.json uses range specifiers (^, ~, >=) or if
        # bun.lock resolved a different version than package.json declares.
        # Keeps fresh installs deterministic so security scans stay green.
        run: bun run scripts/verify-pinned-deps.ts
      - name: Install with frozen lockfile
        # --frozen-lockfile ensures CI installs exactly what's committed;
        # any drift between package.json and bun.lock fails the job.
        run: bun install --frozen-lockfile
      - name: bun audit (high+)
        # `bun audit` queries the npm advisory DB. Fail only on high/critical
        # so transient low-severity noise doesn't block PRs.
        run: bun audit --audit-level=high

  sast-semgrep:
    name: SAST (semgrep)
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Verify sovereign runner Python 3.12
        run: |
          python --version
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Install Semgrep
        run: |
          python -m pip install --disable-pip-version-check semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/semgrep" --version
      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nodejsscan \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            .
      - name: Set up Bun for SARIF tooling
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Summarize Semgrep findings
        if: always() && hashFiles('semgrep.sarif') != ''
        run: bun run scripts/summarize-sarif.ts semgrep.sarif --label "Semgrep" --top "$SARIF_SUMMARY_TOP_N"
      - name: Upload Semgrep SARIF artifact
        id: upload-semgrep-sarif
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@v6
        with:
          name: semgrep-sarif-${{ github.run_id }}-${{ github.sha }}
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: ${{ env.SARIF_RETENTION_DAYS }}
      - name: Annotate PR with top Semgrep findings
        if: always() && github.event_name == 'pull_request' && steps.upload-semgrep-sarif.outputs.artifact-id != ''
        env:
          ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-semgrep-sarif.outputs.artifact-id }}
        run: bun run scripts/annotate-sarif.ts semgrep.sarif --label "Semgrep" --top "$SARIF_SUMMARY_TOP_N" --artifact-url "$ARTIFACT_URL"
      - name: Enforce Semgrep error-level gate
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          set -euo pipefail
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "::error::Semgrep scanner/configuration failed. Review the scan log."
            exit 1
          fi
          if [ ! -s semgrep.sarif ]; then
            echo "::error::Semgrep completed without producing semgrep.sarif."
            exit 1
          fi
          python - <<'PY'
          import json
          import sys

          with open("semgrep.sarif", encoding="utf-8") as fh:
              sarif = json.load(fh)

          offenders = []
          for run in sarif.get("runs", []):
              rules = run.get("tool", {}).get("driver", {}).get("rules", [])
              levels = {
                  rule.get("id"): (rule.get("defaultConfiguration") or {}).get("level", "warning")
                  for rule in rules
              }
              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "unknown-rule")
                  level = result.get("level") or levels.get(rule_id, "warning")
                  if level != "error":
                      continue
                  message = (result.get("message") or {}).get("text", "Semgrep error-level finding")
                  locations = result.get("locations") or []
                  uri = ""
                  line = ""
                  if locations:
                      physical = (locations[0].get("physicalLocation") or {})
                      uri = (physical.get("artifactLocation") or {}).get("uri", "")
                      line = (physical.get("region") or {}).get("startLine", "")
                  offenders.append((rule_id, uri, line, message))

          if offenders:
              print(f"::error::Semgrep found {len(offenders)} error-level finding(s).")
              for rule_id, uri, line, message in offenders:
                  location = f" file={uri},line={line}" if uri and line else ""
                  print(f"::error{location}::{rule_id}: {message}")
              sys.exit(1)

          print("Semgrep: no error-level findings; warning-level findings remain visible in SARIF.")
          PY
  pr-comment:
    name: SARIF artifacts PR comment
    # Only runs on pull_request events; skipped for push/schedule/manual runs
    # since there is no PR to comment on. Always runs even if scan jobs
    # failed — reviewers still want the SARIF download link for triage.
    if: always() && github.event_name == 'pull_request'
    needs: [sast-semgrep]
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin]
    timeout-minutes: 5
    permissions:
      pull-requests: write
      actions: read
      contents: read
    steps:
      - name: Post/update sticky SARIF-artifacts comment
        uses: actions/github-script@v8
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          SEMGREP_RESULT: ${{ needs.sast-semgrep.result }}
          RETENTION: ${{ env.SARIF_RETENTION_DAYS }}
        with:
          script: |
            const marker = '<!-- security-scan:sarif-artifacts -->';
            const { RUN_ID, SHA, SEMGREP_RESULT, RETENTION } = process.env;
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${RUN_ID}`;
            const summaryUrl = `${runUrl}#step-summary`;
            const shortSha = SHA.slice(0, 7);

            // Fork PRs run with a read-only GITHUB_TOKEN — pull-requests: write
            // is downgraded, and listWorkflowRunArtifacts may also be blocked.
            // Detect the fork case up front so we can skip API calls that would
            // 403 and fall back to job-summary links instead of hard-failing.
            const isFork = !!(pr.head?.repo?.full_name && pr.head.repo.full_name !== `${owner}/${repo}`);

            // Try to resolve real artifact download URLs. Any failure (403 on
            // fork PRs, transient API error, empty list) falls back to the
            // job summary link so reviewers still get somewhere useful to click.
            let artifactData = { artifacts: [] };
            let artifactsResolved = false;
            try {
              const res = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: Number(RUN_ID), per_page: 100,
              });
              artifactData = res.data;
              artifactsResolved = true;
            } catch (err) {
              core.warning(`Could not list run artifacts (${err.status || 'error'}: ${err.message}); falling back to job-summary links.`);
            }

            const artifactCell = (namePrefix, label) => {
              const a = artifactData.artifacts.find((x) => x.name.startsWith(namePrefix));
              if (a) {
                return `[\`${a.name}\`](https://github.com/${owner}/${repo}/actions/runs/${RUN_ID}/artifacts/${a.id})`;
              }
              if (!artifactsResolved) {
                // API unavailable (e.g. fork PR) — link to the run's Artifacts
                // section and to the job summary so reviewers can still triage.
                return `[Artifacts tab](${runUrl}#artifacts) · [${label} summary](${summaryUrl})`;
              }
              return `_(not produced — job may have failed before upload)_`;
            };
            const icon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : r === 'cancelled' ? '⚪' : '⏭️';

            const forkNote = isFork
              ? `\n> ℹ️ **Fork PR detected** — GitHub restricts the Actions API for forks, so direct artifact download links may be unavailable. Use the [job summary](${summaryUrl}) or the run's [Artifacts tab](${runUrl}#artifacts) instead.\n`
              : '';

            const body = [
              marker,
              `## 🔎 Security scan SARIF artifacts`,
              ``,
              `Commit \`${shortSha}\` · [Run #${RUN_ID}](${runUrl}) · Retention: **${RETENTION} days**`,
              forkNote,
              `| Scanner | Status | SARIF artifact |`,
              `| ------- | ------ | -------------- |`,
              `| Semgrep | ${icon(SEMGREP_RESULT)} \`${SEMGREP_RESULT}\` | ${artifactCell('semgrep-sarif-', 'Semgrep')} |`,
              ``,
              `<sub>Download the SARIF, then triage with any viewer (e.g. \`code --install-extension MS-SarifVSCode.sarif-viewer\`), or check the top rule IDs in the [job summary](${summaryUrl}).</sub>`,
            ].join('\n');

            // Sticky comment upsert. On fork PRs GITHUB_TOKEN lacks
            // pull-requests: write, so listComments/create/update will 403.
            // Wrap in try/catch and mirror the payload into the job summary so
            // reviewers still see the artifact table on the run page.
            const emitFallbackSummary = (reason) => {
              core.warning(`PR comment skipped (${reason}); rendering to job summary instead.`);
              core.summary
                .addRaw(body.replace(marker, ''))
                .addRaw(`\n\n_Posted to the job summary because the PR comment could not be written (${reason})._\n`)
                .write();
            };

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            } catch (err) {
              const status = err.status || 'error';
              if (status === 403 || status === 404 || isFork) {
                emitFallbackSummary(`fork PR / restricted token: ${err.message}`);
              } else {
                emitFallbackSummary(`${status}: ${err.message}`);
                throw err;
              }
            }
