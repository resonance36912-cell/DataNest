# worktree-gate: false
name: Notify Mirror of canonical DataNest main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Dispatch canonical-main update to Mirror
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch when Mirror sync token is configured
        env:
          MIRROR_SYNC_TOKEN: ${{ secrets.DATANEST_MIRROR_SYNC_TOKEN }}
          CANONICAL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_SYNC_TOKEN:-}" ]; then
            echo "DATANEST_MIRROR_SYNC_TOKEN is not configured; Mirror hourly reconciliation remains the fallback."
            exit 0
          fi

          payload="$(jq -n             --arg event_type "canonical-main-updated"             --arg canonical_sha "$CANONICAL_SHA"             --arg repository "$GITHUB_REPOSITORY"             --arg ref "$GITHUB_REF"             '{event_type:$event_type,client_payload:{canonical_sha:$canonical_sha,repository:$repository,ref:$ref}}'
          )"

          curl --fail-with-body --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $MIRROR_SYNC_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/DataNest-Supository/Mirror-DataNest/dispatches             --data-binary "$payload"

