name: Temporary format billing stop

on:
  push:
    branches:
      - ronsas/free-promotion-stop-recurring-20260920

permissions:
  contents: write

concurrency:
  group: temporary-format-billing-stop
  cancel-in-progress: true

jobs:
  format:
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ronsas/free-promotion-stop-recurring-20260920
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Format complete billing-stop delta
        run: |
          bunx prettier --write \
            .github/workflows/windows-hub-promotion.yml \
            .github/workflows/stop-free-promotion-billing.yml \
            ops/ealiophin/billing/stop-payfast-recurring.mjs \
            ops/release-requests/free-promotion-billing-stop.json \
            scripts/lib/free-promotion-billing-stop.test.ts \
            src/lib/checkout.functions.ts \
            src/routes/api/public/payfast/itn.ts
      - name: Commit formatting and remove temporary workflow
        run: |
          git rm .github/workflows/format-free-promotion-billing-stop.yml
          git config user.name "RONSAS CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/windows-hub-promotion.yml \
            .github/workflows/stop-free-promotion-billing.yml \
            ops/ealiophin/billing/stop-payfast-recurring.mjs \
            ops/release-requests/free-promotion-billing-stop.json \
            scripts/lib/free-promotion-billing-stop.test.ts \
            src/lib/checkout.functions.ts \
            src/routes/api/public/payfast/itn.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            git commit -m "ci: remove temporary billing-stop formatter" || true
          else
            git commit -m "style: format billing-stop delta"
          fi
          git push origin HEAD:ronsas/free-promotion-stop-recurring-20260920
