name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, ronsas, ealiophin, sovereign]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:config
      - run: bun run check:escalation
      - run: bun run check:retention
      - run: bun run check:public-metrics
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
