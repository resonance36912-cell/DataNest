name: One-shot ePublisher Railway root cutover 2026-09-22

on:
  push:
    branches:
      - ronsas/switch-epublisher-root-to-railway-fallback-20260922
    paths:
      - "ops/ealiophin/edge/Caddyfile.cgnat-edge"
      - ".github/workflows/cutover-epublisher-railway-root-20260922.yml"

permissions:
  contents: read

concurrency:
  group: cutover-epublisher-railway-root-20260922
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 12
    steps:
      - name: Switch only the ePublisher SPA root to the verified Railway fallback
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $repo='resonance36912-cell/RONSAS'
          $fallback='https://epublisher-fallback-production.up.railway.app/'
          $publicRoot='https://epublisher.reson8.life/'
          $publicSession='https://epublisher.reson8.life/_rons/session'

          function Get-Http([string]$Url,[int]$Timeout=20){
            return Invoke-WebRequest -UseBasicParsing -Uri $Url -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache'} -TimeoutSec $Timeout
          }

          function Assert-Root([string]$Name,[string]$Url){
            $r=Get-Http $Url
            if([int]$r.StatusCode -ne 200){ throw "$Name returned HTTP $($r.StatusCode)" }
            if(([string]$r.Content).Length -lt 1000){ throw "$Name body unexpectedly small: $(([string]$r.Content).Length)" }
            if(([string]$r.Content) -notmatch '(?i)(Resonance|ePublisher|Open Nova)'){
              throw "$Name body did not match the expected ePublisher fingerprint."
            }
            Write-Host "PASS $Name HTTP 200 bytes=$(([string]$r.Content).Length)"
          }

          function Assert-Session([string]$Name,[string]$Url){
            $r=Get-Http $Url
            if([int]$r.StatusCode -ne 200){ throw "$Name returned HTTP $($r.StatusCode)" }
            try { $null=([string]$r.Content | ConvertFrom-Json -ErrorAction Stop) }
            catch { throw "$Name did not return JSON: $($_.Exception.Message)" }
            Write-Host "PASS $Name HTTP 200 JSON"
          }

          # Prove the replacement origin is healthy before touching production.
          Assert-Root 'Railway fallback preflight' $fallback

          $control=Join-Path $env:LOCALAPPDATA 'Resonance\RONS-ControlCenter'
          $controlConfig=Join-Path $control 'rons-control.json'
          if(-not (Test-Path -LiteralPath $controlConfig -PathType Leaf)){ throw "Control config missing: $controlConfig" }

          $edge=(Get-Content -Raw -LiteralPath $controlConfig | ConvertFrom-Json).publicEdge
          $caddyExe=[string]$edge.caddyExe
          $installed=[string]$edge.caddyConfig
          foreach($p in @($caddyExe,$installed)){
            if(-not (Test-Path -LiteralPath $p -PathType Leaf)){ throw "Required Caddy asset missing: $p" }
          }

          $apiPath="repos/$repo/contents/ops/ealiophin/edge/Caddyfile.cgnat-edge?ref=$env:GITHUB_SHA"
          $encoded=@(& gh.exe api $apiPath --jq .content 2>&1)
          if($LASTEXITCODE -ne 0){ throw "Unable to fetch governed Caddyfile at $env:GITHUB_SHA: $($encoded -join ' ')" }
          $base64=(($encoded -join '') -replace '\s','')
          try { $bytes=[Convert]::FromBase64String($base64) }
          catch { throw "Governed Caddyfile payload was not valid base64: $($_.Exception.Message)" }

          $governed=Join-Path $env:TEMP ('Caddyfile.epublisher-railway-' + $env:GITHUB_RUN_ID)
          [IO.File]::WriteAllBytes($governed,$bytes)

          $source=Get-Content -Raw -LiteralPath $governed
          if($source -notmatch 'reverse_proxy https://epublisher-fallback-production\.up\.railway\.app'){
            throw 'Governed Caddyfile does not contain the exact Railway ePublisher fallback upstream.'
          }
          if($source -notmatch 'handle /_rons/\*'){
            throw 'Governed Caddyfile would not preserve the RONS session bridge.'
          }

          & $caddyExe validate --config $governed
          if($LASTEXITCODE -ne 0){ throw 'Governed Caddyfile validation failed.' }

          $backup=$installed + '.before-epublisher-railway-' + (Get-Date -Format 'yyyyMMdd-HHmmss')
          Copy-Item -LiteralPath $installed -Destination $backup -Force
          $beforeHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash
          $governedHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $governed).Hash
          Write-Host "Installed before SHA256=$beforeHash"
          Write-Host "Governed target SHA256=$governedHash"
          Write-Host "Rollback backup=$backup"

          try {
            Copy-Item -LiteralPath $governed -Destination $installed -Force
            & $caddyExe reload --config $installed
            if($LASTEXITCODE -ne 0){ throw 'Caddy reload failed after Railway root cutover.' }
            Start-Sleep -Seconds 2

            Assert-Root 'Local edge root' 'http://127.0.0.1:8801/'
            Assert-Session 'Local session bridge' 'http://127.0.0.1:8801/_rons/session'

            $rootOk=$false
            for($i=1;$i -le 18;$i++){
              try{
                $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                Assert-Root 'Public ePublisher root' ($publicRoot+'?ronsas_cutover='+$stamp)
                $rootOk=$true
                break
              }catch{
                Write-Host "WAIT public root attempt=$i last=$($_.Exception.Message)"
                if($i -lt 18){ Start-Sleep -Seconds 5 }
              }
            }
            if(-not $rootOk){ throw 'Public ePublisher root did not become healthy during the bounded cutover window.' }

            Assert-Session 'Public session bridge' ($publicSession+'?ronsas_cutover='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())

            $afterHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash
            if($afterHash -ne $governedHash){ throw 'Installed Caddy hash does not match governed target after reload.' }
            Write-Host "PASS installed SHA256=$afterHash"
            Write-Host 'RONSAS EPUB RAILWAY ROOT CUTOVER: PASS'
          }
          catch {
            $failure=$_.Exception.Message
            Write-Warning "Cutover verification failed: $failure"
            Write-Warning 'Restoring the exact pre-cutover Caddyfile.'
            Copy-Item -LiteralPath $backup -Destination $installed -Force
            & $caddyExe reload --config $installed
            if($LASTEXITCODE -ne 0){ throw "Cutover failed ($failure) and rollback reload also failed." }
            Start-Sleep -Seconds 2
            throw "Cutover rolled back: $failure"
          }
