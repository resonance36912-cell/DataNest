name: Governed Linux runner recovery
# Recovery supersession trigger: 2026-09-21T00:42Z (YouTube parser validation backlog)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-recover-linux-runner.yml"
      - "ops/ealiophin/ci/START-RONSAS-ACTIONS-RUNNER.ps1"

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: ronsas-linux-runner-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 20
    steps:
      - name: Check out RONSAS control authority
        uses: actions/checkout@v4

      - name: Cancel obsolete Linux CI backlog
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const targetNames = new Set([
              "Security scan",
              "Verify prebuild",
              "Verify checkout links",
              "Verify ePublisher checkout",
            ]);
            const cancelNames = new Set(["Temporary format free promotion"]);
            const activeStates = new Set(["queued", "pending", "waiting", "in_progress", "requested"]);
            const currentRun = Number(context.runId);

            const mainBranch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            const latestMainSha = mainBranch.data.commit.sha;
            core.info(`latest_main_sha=${latestMainSha}`);

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const openByHead = new Map(
              openPulls.map((pr) => [
                pr.head.ref,
                { number: pr.number, sha: pr.head.sha },
              ]),
            );

            const { data: runsPage } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const runs = runsPage.workflow_runs;

            let cancelled = 0;
            for (const run of runs) {
              if (!activeStates.has(run.status) || run.id === currentRun) continue;

              let reason = null;
              if (targetNames.has(run.name)) {
                if (run.event === "pull_request") {
                  const current = openByHead.get(run.head_branch || "");
                  if (!current) {
                    reason = `closed or unmatched PR branch ${run.head_branch || "(none)"}`;
                  } else if (run.head_sha !== current.sha) {
                    reason = `superseded PR #${current.number} head`;
                  }
                } else if (run.event === "push" && run.head_branch === "main") {
                  if (run.head_sha !== latestMainSha) {
                    reason = "superseded main push";
                  }
                } else if (run.event === "push") {
                  const current = openByHead.get(run.head_branch || "");
                  if (!current) {
                    reason = `orphan non-main branch push ${run.head_branch || "(none)"}`;
                  } else if (run.head_sha !== current.sha) {
                    reason = `superseded push for PR #${current.number}`;
                  }
                }
              } else if (cancelNames.has(run.name)) {
                reason = "obsolete temporary formatter";
              } else if (
                run.name === "Governed Linux runner recovery" ||
                run.name === "Guarded zombie Linux runner recycle"
              ) {
                reason = "superseded recovery run";
              }

              if (!reason) continue;
              core.info(`Cancelling run ${run.id}: ${run.name} - ${reason}`);
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                cancelled += 1;
              } catch (error) {
                core.warning(
                  `Could not cancel run ${run.id}: ${error.status || "error"} ${error.message}`,
                );
              }

              await new Promise((resolve) => setTimeout(resolve, 750));
              try {
                const latest = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                if (activeStates.has(latest.data.status)) {
                  core.warning(
                    `Run ${run.id} remained ${latest.data.status} after cancellation request; forcing cancellation.`,
                  );
                  await github.request(
                    "POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel",
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id,
                    },
                  );
                }
              } catch (error) {
                core.warning(
                  `Run ${run.id} force-cancel check failed: ${error.status || "error"} ${error.message}`,
                );
              }
            }

            core.info(`Cancelled stale/superseded workflow runs: ${cancelled}`);

      - name: Restore existing governed Linux runner container
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $podman=(Get-Command podman.exe -ErrorAction Stop).Source
          $container='ronsas-actions-ealiophin'
          $proxy='ronsas-podman-api'

          function Test-ContainerExists([string]$Name) {
            & $podman container exists $Name
            return ($LASTEXITCODE -eq 0)
          }

          function Test-RunnerListener {
            $top=@(& $podman top $container 2>$null)
            if ($LASTEXITCODE -ne 0) { return $false }
            return (($top -join "`n") -match 'Runner\.Listener')
          }

          if (-not (Test-ContainerExists $proxy)) {
            throw "Governed Podman API proxy is missing: $proxy"
          }
          $proxyInfo=(& $podman inspect $proxy | ConvertFrom-Json)[0]
          if (-not $proxyInfo.State.Running) {
            Write-Host "Starting governed Podman API proxy: $proxy"
            & $podman start $proxy | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to start governed Podman API proxy: $proxy" }
          }

          if (-not (Test-ContainerExists $container)) {
            throw "Existing Linux runner container is missing: $container. Re-registration requires repository runner-administration credentials and is intentionally not attempted with GITHUB_TOKEN."
          }

          $info=(& $podman inspect $container | ConvertFrom-Json)[0]
          if (-not $info.State.Running) {
            Write-Host "Starting existing governed Linux runner container: $container"
            & $podman start $container | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to start existing Linux runner container: $container" }
            Start-Sleep -Seconds 4
            $info=(& $podman inspect $container | ConvertFrom-Json)[0]
          }

          if (-not $info.State.Running) {
            throw "Linux runner container is not running after recovery attempt: $container"
          }

          if (-not (Test-RunnerListener)) {
            Write-Host 'Runner.Listener is not active inside the existing container; restarting container once.'
            & $podman restart $container | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to restart Linux runner container: $container" }
            Start-Sleep -Seconds 5
            if (-not (Test-RunnerListener)) {
              throw 'Runner.Listener did not become active after local container restart.'
            }
          }

          & $podman exec $container podman --remote version *> $null
          if ($LASTEXITCODE -ne 0) {
            throw 'Linux runner container cannot reach the governed Podman API proxy.'
          }

          Write-Host 'Existing governed Linux runner container is running with Runner.Listener active.'
          & $podman logs --tail 30 $container

      - name: Verify local Linux runner control state
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $podman=(Get-Command podman.exe -ErrorAction Stop).Source
          $container='ronsas-actions-ealiophin'
          & $podman container exists $container
          if ($LASTEXITCODE -ne 0) { throw "Linux runner container does not exist: $container" }
          $info=(& $podman inspect $container | ConvertFrom-Json)[0]
          $top=@(& $podman top $container 2>$null)
          $listenerUp=(($top -join "`n") -match 'Runner\.Listener')
          Write-Host "container=$container running=$($info.State.Running) status=$($info.State.Status) listener=$listenerUp"
          if (-not $info.State.Running) { throw "Linux runner container is not running: $container" }
          if (-not $listenerUp) { throw 'Runner.Listener is not active inside the Linux runner container.' }

      - name: Keep Linux runner available while exact-head CI drains
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $repo='resonance36912-cell/RONSAS'
          $podman=(Get-Command podman.exe -ErrorAction Stop).Source
          $container='ronsas-actions-ealiophin'
          $targetNames=@('Security scan','Verify prebuild','Verify checkout links','Verify ePublisher checkout')
          $currentRun=[long]$env:GITHUB_RUN_ID
          $queuedOnlyCycles=0
          $remaining=-1

          function Test-RunnerListener {
            $top=@(& $podman top $container 2>$null)
            if ($LASTEXITCODE -ne 0) { return $false }
            return (($top -join "`n") -match 'Runner\.Listener')
          }

          for ($i=0; $i -lt 60; $i++) {
            $runsRaw=& gh.exe api "repos/$repo/actions/runs?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to query CI backlog.' }
            $runsPayload=($runsRaw -join "`n") | ConvertFrom-Json
            $runs=@($runsPayload.workflow_runs)
            $active=@($runs | Where-Object {
              ($targetNames -contains [string]$_.name) -and
              (@('queued','pending','waiting','in_progress','requested') -contains [string]$_.status)
            })
            $remaining=$active.Count

            if ($remaining -eq 0) {
              Write-Host 'No active Linux CI backlog remains.'
              break
            }

            $targetInProgress=@($active | Where-Object { [string]$_.status -eq 'in_progress' })
            $otherInProgress=@($runs | Where-Object {
              ([long]$_.id -ne $currentRun) -and ([string]$_.status -eq 'in_progress')
            })

            & $podman container exists $container
            if ($LASTEXITCODE -ne 0) {
              throw "Linux runner container disappeared while CI backlog remained: $container"
            }

            $info=(& $podman inspect $container | ConvertFrom-Json)[0]
            if (-not $info.State.Running) {
              Write-Host "Runner container stopped with active backlog=$remaining; restarting existing container."
              & $podman start $container | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Failed to restart Linux runner container: $container" }
              Start-Sleep -Seconds 5
              $queuedOnlyCycles=0
            } elseif (-not (Test-RunnerListener)) {
              Write-Host "Runner.Listener missing with active backlog=$remaining; restarting existing container."
              & $podman restart $container | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Failed to restart Linux runner container: $container" }
              Start-Sleep -Seconds 5
              $queuedOnlyCycles=0
            } elseif ($targetInProgress.Count -gt 0) {
              $queuedOnlyCycles=0
              Write-Host "Linux runner actively processing target CI; backlog=$remaining."
            } elseif ($otherInProgress.Count -eq 0) {
              $queuedOnlyCycles++
              Write-Host "Target CI remains queued with no other repository job in progress; idle cycles=$queuedOnlyCycles backlog=$remaining."
              if ($queuedOnlyCycles -ge 3) {
                $runnerName='Ealiophin-RONSAS-Linux-2'
                $runnerRaw=& gh.exe api "repos/$repo/actions/runners"
                if ($LASTEXITCODE -ne 0) {
                  throw 'Unable to query GitHub runner registration before guarded recycle.'
                }
                $runnerPayload=($runnerRaw -join "`n") | ConvertFrom-Json
                $registered=@($runnerPayload.runners | Where-Object { [string]$_.name -eq $runnerName }) | Select-Object -First 1

                if ($registered -and [bool]$registered.busy) {
                  Write-Host "GitHub runner registration reports busy; preserving it. backlog=$remaining"
                } else {
                  $launcher=Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\ci\START-RONSAS-ACTIONS-RUNNER.ps1'
                  if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
                    throw "Canonical runner launcher missing: $launcher"
                  }
                  Write-Host 'Guarded registration recycle: queued target CI has remained idle for three cycles and GitHub reports the runner is not busy.'
                  & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -ForceRecycle
                  if ($LASTEXITCODE -ne 0) {
                    throw "Guarded Linux registration recycle failed with exit code $LASTEXITCODE"
                  }
                  Start-Sleep -Seconds 5
                }
                $queuedOnlyCycles=0
              }
            } else {
              $queuedOnlyCycles=0
              Write-Host "Another repository workflow is in progress; preserving runner state. target backlog=$remaining."
            }

            Start-Sleep -Seconds 10
          }

          if ($remaining -gt 0) {
            throw "Linux CI backlog did not drain during the ten-minute watchdog window. Runner registration may require repository-admin repair; refusing to claim recovery."
          }
