name: Governed Linux runner recovery
# Recovery trigger audit: 2026-09-20 free-promotion CI queue recovery — trigger 2

on:
  # workflow_dispatch is the normal manual recovery path. When the connector
  # cannot dispatch workflows directly, a reviewed no-op change to this file
  # also triggers the same governed Windows-side recovery via the push path.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-recover-linux-runner.yml"
      - "ops/ealiophin/ci/START-RONSAS-ACTIONS-RUNNER.ps1"

permissions:
  contents: read

concurrency:
  group: ronsas-linux-runner-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 10
    steps:
      - name: Check out RONSAS control authority
        uses: actions/checkout@v4

      - name: Restore governed Linux Actions runner
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'ops\ealiophin\ci\START-RONSAS-ACTIONS-RUNNER.ps1'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) { throw "Runner recovery script missing: $script" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { throw "Linux runner recovery failed with exit code $LASTEXITCODE" }

      - name: Verify Linux runner is online
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $repo='resonance36912-cell/RONSAS'
          $name='Ealiophin-RONSAS-Linux-2'
          $payload = & gh.exe api "repos/$repo/actions/runners" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query GitHub runner registration.' }
          $runner = @($payload.runners | Where-Object { $_.name -eq $name }) | Select-Object -First 1
          if (-not $runner) { throw "Runner registration not found: $name" }
          if ([string]$runner.status -ne 'online') { throw "Runner is not online: status=$($runner.status)" }
          $labels = @($runner.labels | ForEach-Object { [string]$_.name })
          foreach ($required in @('self-hosted','Linux','X64','ronsas','ealiophin')) {
            if ($labels -notcontains $required) { throw "Runner missing required label: $required" }
          }
          Write-Host "RONSAS Linux runner online: $name"

      - name: Cancel obsolete closed-PR workflow backlog
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $repo='resonance36912-cell/RONSAS'
          $cancelled = 0

          $openPullsRaw = & gh.exe api "repos/$repo/pulls?state=open&per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query open pull requests.' }
          $openHeadBranches = @(
            ($openPullsRaw | ConvertFrom-Json) |
              ForEach-Object { [string]$_.head.ref } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Sort-Object -Unique
          )

          foreach ($status in @('queued','in_progress')) {
            $runsRaw = & gh.exe api "repos/$repo/actions/runs?status=$status&per_page=100"
            if ($LASTEXITCODE -ne 0) { throw "Unable to query $status workflow runs." }
            $runs = @(($runsRaw | ConvertFrom-Json).workflow_runs)

            foreach ($run in $runs) {
              if ([string]$run.event -ne 'pull_request') { continue }

              $head = [string]$run.head_branch

              # GitHub sometimes omits pull_requests[] from workflow-run payloads.
              # In that case, use the run's head branch only when it is absent
              # from the complete set of currently open PR head branches.
              $prs = @($run.pull_requests)
              if ($prs.Count -eq 0) {
                if ([string]::IsNullOrWhiteSpace($head)) {
                  Write-Host "Keeping $status run $($run.id): no PR relation or head branch available."
                  continue
                }
                if ($openHeadBranches -contains $head) {
                  Write-Host "Keeping $status run $($run.id): branch [$head] still has an open PR."
                  continue
                }

                Write-Host "Cancelling obsolete $status PR run $($run.id): $($run.name) [$head] has no open PR."
                & gh.exe api -X POST "repos/$repo/actions/runs/$($run.id)/cancel" *> $null
                if ($LASTEXITCODE -eq 0) {
                  $cancelled++
                } else {
                  Write-Warning "Run $($run.id) could not be cancelled (it may have completed concurrently)."
                }
                continue
              }

              $allClosed = $true
              foreach ($prRef in $prs) {
                $prNumber = [int]$prRef.number
                $state = (& gh.exe api "repos/$repo/pulls/$prNumber" --jq .state).Trim()
                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($state)) {
                  Write-Warning "Keeping run $($run.id): unable to verify PR #$prNumber state."
                  $allClosed = $false
                  break
                }
                if ($state -ne 'closed') {
                  Write-Host "Keeping run $($run.id): PR #$prNumber is $state."
                  $allClosed = $false
                  break
                }
              }

              if (-not $allClosed) { continue }

              Write-Host "Cancelling obsolete $status closed-PR run $($run.id): $($run.name) [$head]"
              & gh.exe api -X POST "repos/$repo/actions/runs/$($run.id)/cancel" *> $null
              if ($LASTEXITCODE -eq 0) {
                $cancelled++
              } else {
                Write-Warning "Run $($run.id) could not be cancelled (it may have completed concurrently)."
              }
            }
          }

          Write-Host "Obsolete closed-PR workflow runs cancelled: $cancelled"
