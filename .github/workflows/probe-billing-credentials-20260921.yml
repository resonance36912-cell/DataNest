name: One-shot billing credential probe
# refreshed after governed Linux runner recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-billing-credentials-20260921.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, ronsas, ealiophin, production-host]
    timeout-minutes: 8
    env:
      GH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
      GH_PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Inspect credential names and Supabase linkage
        shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Get-Content -Raw '{0}')))"
        run: |
          $ErrorActionPreference='Stop'
          $hub='C:\Resonance\Sources\ronsas-hub-canonical'
          $envFile=Join-Path $hub '.env.local'
          if(-not (Test-Path -LiteralPath $envFile -PathType Leaf)){throw "Hub runtime env missing: $envFile"}

          $names=@()
          foreach($line in Get-Content -LiteralPath $envFile){
            if($line -match '^\s*([A-Za-z_][A-Za-z0-9_]*)\s*='){
              $name=[string]$Matches[1]
              if($name -match '^(SUPABASE|PAYFAST|DATABASE|POSTGRES)'){
                $names += $name
              }
            }
          }
          $names = $names | Sort-Object -Unique
          Write-Host ('credential_names=' + ($names -join ','))

          Write-Host ('actions_secret_SUPABASE_SERVICE_ROLE_KEY_present=' + [bool]$env:GH_SUPABASE_SERVICE_ROLE_KEY)
          Write-Host ('actions_secret_SUPABASE_SECRET_KEY_present=' + [bool]$env:GH_SUPABASE_SECRET_KEY)
          Write-Host ('actions_secret_PAYFAST_MERCHANT_ID_present=' + [bool]$env:GH_PAYFAST_MERCHANT_ID)
          Write-Host ('actions_secret_PAYFAST_PASSPHRASE_present=' + [bool]$env:GH_PAYFAST_PASSPHRASE)

          $processNames=@($env: | Where-Object { $_.Name -match '^(SUPABASE|PAYFAST|DATABASE|POSTGRES)' } | Select-Object -ExpandProperty Name | Sort-Object -Unique)
          Write-Host ('process_credential_names=' + ($processNames -join ','))

          $projectRefPath=Join-Path $hub 'supabase\.temp\project-ref'
          if(Test-Path -LiteralPath $projectRefPath -PathType Leaf){
            $projectRef=(Get-Content -Raw -LiteralPath $projectRefPath).Trim()
            Write-Host ('linked_project_ref=' + $projectRef)
          } else {
            Write-Host 'linked_project_ref=missing'
          }

          $cli=Get-Command supabase.exe -ErrorAction SilentlyContinue
          if(-not $cli){$cli=Get-Command supabase -ErrorAction SilentlyContinue}
          if(-not $cli){
            Write-Host 'supabase_cli=missing'
            exit 0
          }
          Write-Host ('supabase_cli=present path=' + $cli.Source)
          & $cli.Source --version

          $target='qitzhxncffcszbpsddpm'
          $output=& $cli.Source projects api-keys --project-ref $target --output json 2>&1
          $code=$LASTEXITCODE
          if($code -ne 0){
            Write-Host ('supabase_api_keys_query=failed exit=' + $code)
            exit 0
          }

          try{
            $payload=($output -join [Environment]::NewLine) | ConvertFrom-Json
            $keyNames=@()
            foreach($item in @($payload)){
              foreach($candidate in @('name','type','key_type')){
                if($item.PSObject.Properties.Name -contains $candidate){
                  $value=[string]$item.$candidate
                  if($value){$keyNames += $value}
                }
              }
            }
            $keyNames=$keyNames | Sort-Object -Unique
            Write-Host ('supabase_api_keys_query=ok key_types=' + ($keyNames -join ','))
            Write-Host ('service_role_available=' + [bool](($keyNames -join ',') -match 'service'))
          } catch {
            Write-Host 'supabase_api_keys_query=ok parse=failed'
          }
